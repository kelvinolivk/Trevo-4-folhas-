<!DOCTYPE html>
<html>
<head>

<title>Admin - Trevo4Folhas 🍀</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
}

.caixa {
    background: #222;
    padding: 15px;
    border-radius: 10px;
    margin: 10px;
}

</style>

</head>
<script>

let senha = prompt("Digite a senha do administrador:");

if(senha !== "trevo123"){

    alert("Senha incorreta!");

    window.location.href="../index.html";

}
function confirmarPagamento(nome){

let participantes =
JSON.parse(localStorage.getItem("participantes")) || [];

participantes.forEach(function(p){

    if(p.nome == nome){

        p.pagamento = "🟢 Pagamento confirmado";

    }

});

localStorage.setItem(
"participantes",
JSON.stringify(participantes)
);

location.reload();

}
</script>
<body>

<h1>🔐 Admin Trevo4Folhas</h1>

<div class="caixa">
<p>Números reservados:</p>
<p id="lista">Carregando reservas...</p>
</div>


<script>

let lista = document.getElementById("lista");

let participantes =
JSON.parse(localStorage.getItem("participantes")) || [];

if(participantes.length == 0){

    lista.innerHTML = "Nenhuma aposta registrada 🍀";

}else{

    lista.innerHTML = "";

    participantes.forEach(function(p){

    lista.innerHTML += `
<div class="caixa">

👤 ${p.nome}<br>
📱 ${p.whatsapp}<br>
🍀 Números: ${p.numero}<br>
💰 <span id="status${p.nome}">${p.pagamento}</span><br><br>

<button onclick="confirmarPagamento('${p.nome}')">
✅ Confirmar Pagamento
</button>

</div>
`;

    });

}

</script>
</body>
</html>
