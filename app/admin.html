<html lang="pt-BR">

<head>

<meta charset="UTF-8">

🎟️ Sortear Rifa
</button>

<br>

🗑️ Apagar Histórico
</button>

🔐 Alterar Senha
</button>

🏠 Voltar ao início
</button>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


// =====================================
// SENHA
// =====================================

let senhaSalva =
localStorage.getItem("senhaAdmin") || "trevo123";

let senha = prompt(
"Digite a senha do administrador:"
);

if(senha !== senhaSalva){

    alert("Senha incorreta!");

    window.location.href="../index.html";

}


// =====================================
// CONFIGURAÇÕES
// =====================================

let configuracao = {};


// =====================================
// CARREGAR CONFIGURAÇÕES DO SUPABASE
// =====================================

async function carregarConfiguracoes(){

    try{

        const { data, error } = await supabaseClient
            .from("configuracoes")
            .select("*")
            .in("tipo",["loteria","rifa"]);

        if(error){
            throw error;
        }


        // ==============================
        // LOTERIA
        // ==============================

        let loteria = data.find(function(item){
            return item.tipo === "loteria";
        });


        if(loteria){

            configuracao = {

                premio:loteria.premio || "",

                valorAposta:loteria.valor || "",

                pix:loteria.pix || "",

                data:loteria.data || "",

                hora:loteria.hora || "",

                mensagem:loteria.mensagem || ""

            };


            document.getElementById("premio").value =
                configuracao.premio;

            document.getElementById("valorAposta").value =
                configuracao.valorAposta;

            document.getElementById("pixLoteria").value =
                configuracao.pix;

            document.getElementById("data").value =
                configuracao.data;

            document.getElementById("hora").value =
                configuracao.hora;

            document.getElementById("mensagem").value =
                configuracao.mensagem;


            localStorage.setItem(
                "configuracao",
                JSON.stringify(configuracao)
            );

        }


        // ==============================
        // RIFA
        // ==============================

        let rifa = data.find(function(item){
            return item.tipo === "rifa";
        });


        if(rifa){

            let configuracaoRifa = {

                valor:rifa.valor || "",

                premio:rifa.premio || "",

                pix:rifa.pix || ""

            };


            document.getElementById("valorRifa").value =
                configuracaoRifa.valor;

            document.getElementById("premioRifa").value =
                configuracaoRifa.premio;

            document.getElementById("pixRifa").value =
                configuracaoRifa.pix;


            localStorage.setItem(
                "configuracaoRifa",
                JSON.stringify(configuracaoRifa)
            );

        }


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao carregar configurações:\n\n" +
            error.message
        );

    }

}


// =====================================
// SALVAR CONFIGURAÇÕES DA LOTERIA
// =====================================

async function salvarConfiguracoes(){

    let novaConfiguracao = {

        premio:
            document.getElementById("premio").value,

        valorAposta:
            document.getElementById("valorAposta").value,

        pix:
            document.getElementById("pixLoteria").value,

        data:
            document.getElementById("data").value,

        hora:
            document.getElementById("hora").value,

        mensagem:
            document.getElementById("mensagem").value

    };


    try{

        const { error } = await supabaseClient
            .from("configuracoes")
            .update({

                valor:novaConfiguracao.valorAposta,

                premio:novaConfiguracao.premio,

                pix:novaConfiguracao.pix,

                data:novaConfiguracao.data,

                hora:novaConfiguracao.hora,

                mensagem:novaConfiguracao.mensagem,

                atualizado_em:new Date().toISOString()

            })
            .eq("tipo","loteria");


        if(error){
            throw error;
        }


        localStorage.setItem(
            "configuracao",
            JSON.stringify(novaConfiguracao)
        );


        alert(
            "🍀 Configurações da Loteria salvas no servidor!"
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao salvar:\n\n" +
            error.message
        );

    }

}


// =====================================
// ALTERAR SENHA
// =====================================

function alterarSenha(){

    let novaSenha =
        prompt("Digite a nova senha:");

    if(!novaSenha){
        return;
    }

    localStorage.setItem(
        "senhaAdmin",
        novaSenha
    );

    alert(
        "🔐 Senha alterada com sucesso!"
    );

}


// =====================================
// CARREGAR APOSTAS
// =====================================

async function carregarApostas(){

    let lista =
        document.getElementById("lista");

    lista.innerHTML =
        "⏳ Carregando apostas...";


    try{

        const { data, error } =
            await supabaseClient
            .from("participantes")
            .select("*")
            .order("id",{ascending:false});


        if(error){
            throw error;
        }


        if(!data || data.length === 0){

            lista.innerHTML =
                "Nenhuma aposta registrada 🍀";

            document.getElementById(
                "financeiro"
            ).innerHTML =
                "Nenhuma aposta registrada.";

            return;

        }


        let html = "";

        let pagos = 0;


        data.forEach(function(p){

            if(
                p.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }


            html += `

            <div class="aposta">

            👤 <b>
            ${p.nome || "Não informado"}
            </b>

            <br><br>

            📱 WhatsApp:
            <br>
            ${p.whatsapp || "Não informado"}

            <br><br>

            💳 Pix:
            <br>
            ${p.pix || "Não informado"}

            <br><br>

            📍 Cidade:
            <br>
            ${p.cidade || "Não informado"}

            <br><br>

            🍀 Números:
            <br>
            ${p.numeros || "Não informado"}

            <br><br>

            💰 Status:
            <br>

            <span class="status">
            ${p.pagamento || "🟡 Aguardando pagamento"}
            </span>

            <br><br>

            <button
            onclick="confirmarPagamento(${p.id})">

            ✅ Confirmar pagamento

            </button>

            </div>

            `;

        });


        lista.innerHTML = html;


        let valorAposta =
            Number(
                document.getElementById(
                    "valorAposta"
                ).value
            ) || 0;


        let arrecadado =
            pagos * valorAposta;


        let premio =
            Number(
                document.getElementById(
                    "premio"
                ).value
            ) || 0;


        let saldo =
            arrecadado - premio;


        document.getElementById(
            "financeiro"
        ).innerHTML =

        "🎟️ Total de apostas: " +
        data.length +

        "<br><br>" +

        "🟢 Pagamentos confirmados: " +
        pagos +

        "<br><br>" +

        "💰 Arrecadado: R$ " +
        arrecadado.toFixed(2) +

        "<br><br>" +

        "🏆 Prêmio: R$ " +
        premio.toFixed(2) +

        "<br><br>" +

        "📈 Saldo: R$ " +
        saldo.toFixed(2);


    }catch(error){

        console.error(error);

        lista.innerHTML =
            "❌ Erro ao carregar apostas:<br><br>" +
            error.message;

    }

}


// =====================================
// CONFIRMAR PAGAMENTO
// =====================================

async function confirmarPagamento(id){

    if(!id){

        alert(
            "❌ Aposta não identificada."
        );

        return;

    }


    let confirmar =
        confirm(
            "Confirmar o pagamento desta aposta?"
        );


    if(!confirmar){
        return;
    }


    try{

        const { error } =
            await supabaseClient
            .from("participantes")
            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })
            .eq("id",id);


        if(error){
            throw error;
        }


        alert(
            "🟢 Pagamento confirmado!"
        );


        carregarApostas();


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao confirmar pagamento:\n\n" +
            error.message
        );

    }

}


// =====================================
// SALVAR RIFA NO SUPABASE
// =====================================

async function salvarRifa(){

    let configuracaoRifa = {

        valor:
            document.getElementById(
                "valorRifa"
            ).value,

        premio:
            document.getElementById(
                "premioRifa"
            ).value,

        pix:
            document.getElementById(
                "pixRifa"
            ).value

    };


    try{

        const { error } =
            await supabaseClient
            .from("configuracoes")
            .update({

                valor:
                    configuracaoRifa.valor,

                premio:
                    configuracaoRifa.premio,

                pix:
                    configuracaoRifa.pix,

                atualizado_em:
                    new Date().toISOString()

            })
            .eq("tipo","rifa");


        if(error){
            throw error;
        }


        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify(configuracaoRifa)
        );


        alert(
            "🎟️ Configuração da Rifa salva no servidor! 🍀"
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao salvar Rifa:\n\n" +
            error.message
        );

    }

}


// =====================================
// CARREGAR RIFA
// =====================================

async function carregarRifa(){

    let vendas =
        document.getElementById(
            "vendasRifa"
        );


    try{

        const { data, error } =
            await supabaseClient
            .from("rifa_participantes")
            .select("*")
            .order("id",{ascending:false});


        if(error){
            throw error;
        }


        let rifa = data || [];


        if(rifa.length === 0){

            vendas.innerHTML =
                "Nenhuma venda de rifa realizada.";

            return;

        }


        let configRifa =
            JSON.parse(
                localStorage.getItem(
                    "configuracaoRifa"
                )
            ) || {};


        let valor =
            Number(configRifa.valor) || 0;


        let premio =
            Number(configRifa.premio) || 0;


        let pagos = 0;

        let html = "";


        rifa.forEach(function(r){

            if(
                r.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }


            html += `

            <div class="aposta">

            👤 <b>
            ${r.nome || "Não informado"}
            </b>

            <br><br>

            📱
            ${r.whatsapp || "Não informado"}

            <br><br>

            🎟️ Número:
            <br>

            <b>
            ${String(r.numero).padStart(2,"0")}
            </b>

            <br><br>

            💰 Status:
            <br>

            ${r.pagamento ||
            "🟡 Aguardando pagamento"}

            <br><br>

            <button
            onclick="confirmarPagamentoRifa(${r.id})">

            ✅ Confirmar pagamento

            </button>

            </div>

            `;

        });


        vendas.innerHTML = html;


        let arrecadado =
            pagos * valor;


        let lucro =
            arrecadado - premio;


        document.getElementById(
            "financeiroRifa"
        ).innerHTML =

        "💰 Valor por número: R$ " +
        valor.toFixed(2) +

        "<br><br>" +

        "🎟️ Vendidos: " +
        rifa.length +
        " / 100" +

        "<br><br>" +

        "🟢 Pagos: " +
        pagos +

        "<br><br>" +

        "💵 Arrecadado: R$ " +
        arrecadado.toFixed(2) +

        "<br><br>" +

        "🏆 Prêmio: R$ " +
        premio.toFixed(2) +

        "<br><br>" +

        "📈 Lucro: R$ " +
        lucro.toFixed(2);


    }catch(error){

        console.error(error);

        vendas.innerHTML =
            "❌ Erro ao carregar Rifa:<br><br>" +
            error.message;

    }

}


// =====================================
// CONFIRMAR PAGAMENTO RIFA
// =====================================

async function confirmarPagamentoRifa(id){

    let confirmar =
        confirm(
            "Confirmar pagamento desta Rifa?"
        );


    if(!confirmar){
        return;
    }


    try{

        const { error } =
            await supabaseClient
            .from("rifa_participantes")
            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })
            .eq("id",id);


        if(error){
            throw error;
        }


        alert(
            "🟢 Pagamento da Rifa confirmado!"
        );


        carregarRifa();


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao confirmar pagamento:\n\n" +
            error.message
        );

    }

}


// =====================================
// SORTEIO DA LOTERIA
// =====================================

async function realizarSorteio(){

    let numeros = [];


    while(numeros.length < 4){

        let n =
            Math.floor(
                Math.random() * 15
            ) + 1;


        if(!numeros.includes(n)){

            numeros.push(n);

        }

    }


    numeros.sort(
        (a,b)=>a-b
    );


    try{

        const { data, error } =
            await supabaseClient
            .from("participantes")
            .select("*");


        if(error){
            throw error;
        }


        let vencedores = [];


        data.forEach(function(p){

            if(
                p.pagamento !==
                "🟢 Pagamento confirmado"
            ){

                return;

            }


            let aposta;


            try{

                aposta =
                    JSON.parse(p.numeros);

            }catch(e){

                return;

            }


            if(
                Array.isArray(aposta) &&
                aposta.every(
                    n => numeros.includes(Number(n))
                )
            ){

                vencedores.push(
                    p.nome
                );

            }

        });


        let configuracao =
            JSON.parse(
                localStorage.getItem(
                    "configuracao"
                )
            ) || {};


        let resultado = {

            numeros:numeros,

            data:
                new Date()
                .toLocaleDateString(
                    "pt-BR"
                ),

            premio:
                configuracao.premio ||
                "Não informado",

            vencedores:
                vencedores.length > 0
                ? vencedores
                : ["🍀 Acumulou"]

        };


        localStorage.setItem(
            "resultadoSorteio",
            JSON.stringify(resultado)
        );


        let historico =
            JSON.parse(
                localStorage.getItem(
                    "historicoSorteios"
                )
            ) || [];


        historico.push(resultado);


        localStorage.setItem(
            "historicoSorteios",
            JSON.stringify(historico)
        );


        alert(

            "🍀 Sorteio realizado!\n\n" +

            "Números:\n" +

            numeros.join(" - ")

        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao realizar sorteio:\n\n" +
            error.message
        );

    }

}


// =====================================
// SORTEIO RIFA
// =====================================

async function sortearRifa(){

    try{

        const { data, error } =
            await supabaseClient
            .from("rifa_participantes")
            .select("*");


        if(error){
            throw error;
        }


        let rifa = data || [];


        if(rifa.length < 100){

            let faltam =
                100 - rifa.length;


            alert(

                "🍀 Ainda não é possível realizar o sorteio.\n
