<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Trevo4Folhas 🍀</title>


<style>

body{

font-family:Arial,sans-serif;

background:#111;

color:white;

text-align:center;

padding:20px;

}


.caixa{

background:#222;

padding:15px;

border-radius:10px;

margin:10px auto;

max-width:400px;

}


input{

width:90%;

padding:10px;

margin:5px;

border-radius:8px;

border:none;

}


button{

background:#0b8f3a;

color:white;

border:none;

border-radius:8px;

padding:10px 15px;

margin-top:10px;

cursor:pointer;

font-weight:bold;

}


</style>


<script>


let senhaSalva =

localStorage.getItem("senhaAdmin") || "trevo123";


let senha = prompt(

"Digite a senha do administrador:"

);



if(senha !== senhaSalva){


alert("Senha incorreta!");


window.location.href="../index.html";


}



function salvarConfiguracoes(){


let configuracao = {


premio:

document.getElementById("premio").value,


valorAposta:

document.getElementById("valorAposta").value,


data:

document.getElementById("data").value,


hora:

document.getElementById("hora").value,


mensagem:

document.getElementById("mensagem").value


};



localStorage.setItem(

"configuracao",

JSON.stringify(configuracao)

);



alert("Configurações salvas 🍀");


}


function alterarSenha(){


let novaSenha = prompt(

"Digite a nova senha:"

);



if(!novaSenha){

return;

}


localStorage.setItem(

"senhaAdmin",

novaSenha

);



alert("Senha alterada com sucesso!");

}


</script>


</head>


<body>


<h1>

🔐 Admin Trevo4Folhas 🍀

</h1>


<div class="caixa">


<h3>

⚙️ Configurações do Sorteio

</h3>


<input id="premio" placeholder="Valor do prêmio">


<input id="valorAposta" placeholder="Valor da aposta">


<input id="data" placeholder="Data do sorteio">


<input id="hora" placeholder="Hora do sorteio">


<input id="mensagem" placeholder="Mensagem">


<button onclick="salvarConfiguracoes()">

💾 Salvar Configurações

</button>


<button onclick="alterarSenha()">

🔐 Alterar Senha

</button>


</div>

<div class="caixa">

<h3>💰 Financeiro</h3>

<div id="financeiro">

Calculando...

</div>

</div>



<div id="lista"></div>



<script>


function confirmarPagamento(indice){


let participantes =

JSON.parse(localStorage.getItem("participantes")) || [];



participantes[indice].pagamento =

"🟢 Pagamento confirmado";



localStorage.setItem(

"participantes",

JSON.stringify(participantes)

);



location.reload();


}





function realizarSorteio(){


let numeros=[];



while(numeros.length < 4){


let n = Math.floor(Math.random()*15)+1;



if(!numeros.includes(n)){


numeros.push(n);


}


}



numeros.sort((a,b)=>a-b);



let participantes =

JSON.parse(localStorage.getItem("participantes")) || [];



let vencedores=[];



participantes.forEach(function(p){



if(p.pagamento === "🟢 Pagamento confirmado"){


let aposta = JSON.parse(p.numero);



let ganhou = aposta.every(function(n){


return numeros.includes(n);


});



if(ganhou){


vencedores.push(p.nome);


}


}



});



let configuracao =

JSON.parse(localStorage.getItem("configuracao")) || {};



let resultado={


numeros:numeros,


data:new Date().toLocaleDateString("pt-BR"),


premio:

configuracao.premio || "Não informado",


vencedores:

vencedores.length > 0 ?

vencedores :

["🍀 Acumulou"]


};



localStorage.setItem(

"resultadoSorteio",

JSON.stringify(resultado)

);



let historico =

JSON.parse(localStorage.getItem("historicoSorteios")) || [];



historico.push(resultado);



localStorage.setItem(

"historicoSorteios",

JSON.stringify(historico)

);



alert(

"🍀 Sorteio realizado!\n\nNúmeros:\n"+

numeros.join(" - ")

);


}




function apagarHistorico(){


let confirmar = confirm(

"Apagar todo histórico de sorteios?"

);



if(confirmar){


localStorage.removeItem(

"historicoSorteios"

);


alert("Histórico apagado 🍀");


}


}
