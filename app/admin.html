<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Trevo4Folhas 🍀</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

.caixa{
    background:#222;
    padding:15px;
    border-radius:12px;
    margin:10px auto;
    max-width:450px;
}

input{
    width:90%;
    padding:12px;
    margin:6px;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
}

button{
    background:#0b8f3a;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 15px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

.aposta{
    background:#333;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.erro{
    color:#ff6666;
}

.sucesso{
    color:#6dff7d;
}

.status{
    padding:8px;
    border-radius:8px;
    display:inline-block;
}

</style>

</head>

<body>

<h1>🔐 Admin Trevo4Folhas 🍀</h1>

<!-- =========================
CONFIGURAÇÃO LOTERIA
========================= -->

<div class="caixa">

<h3>⚙️ Configurações da Loteria</h3>

<input id="premio"
placeholder="Valor do prêmio">

<input id="valorAposta"
placeholder="Valor da aposta">

<input id="pixLoteria"
placeholder="Chave Pix da Loteria">

<input id="data"
placeholder="Data do sorteio">

<input id="hora"
placeholder="Hora do sorteio">

<input id="mensagem"
placeholder="Mensagem">

<button onclick="salvarConfiguracoes()">
💾 Salvar Configurações
</button>

</div>


<!-- =========================
CONFIGURAÇÃO RIFA
========================= -->

<div class="caixa">

<h3>🎟️ Configuração da Rifa</h3>

<input
id="valorRifa"
placeholder="Valor de cada número">

<input
id="premioRifa"
placeholder="Prêmio da Rifa">

<input
id="pixRifa"
placeholder="Chave Pix da Rifa">

<button onclick="salvarRifa()">
💾 Salvar Rifa
</button>

<div id="resultadoRifa"></div>

</div>


<!-- =========================
FINANCEIRO LOTERIA
========================= -->

<div class="caixa">

<h3>💰 Financeiro da Loteria</h3>

<div id="financeiro">
⏳ Carregando...
</div>

</div>


<!-- =========================
APOSTAS
========================= -->

<div class="caixa">

<h3>🍀 Apostas da Loteria</h3>

<div id="lista">
⏳ Carregando apostas...
</div>

</div>


<!-- =========================
RIFA
========================= -->

<div class="caixa">

<h3>🎟️ Vendas da Rifa</h3>

<div id="vendasRifa">
⏳ Carregando rifa...
</div>

<div id="financeiroRifa"
style="
background:#181818;
padding:15px;
margin-top:15px;
border-radius:10px;
font-size:18px;
">

⏳ Calculando financeiro...

</div>

</div>


<br>

<button onclick="realizarSorteio()">
🎲 Realizar Sorteio
</button>

<br>

<button onclick="sortearRifa()">
🎟️ Sortear Rifa
</button>

<br>

<button onclick="apagarHistorico()">
🗑️ Apagar Histórico
</button>

<br><br>

<button onclick="alterarSenha()">
🔐 Alterar Senha
</button>

<br><br>

<button onclick="location.href='../index.html'">
🏠 Voltar ao início
</button>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

let senhaSalva =
localStorage.getItem("senhaAdmin") || "trevo123";

let senha =
prompt("Digite a senha do administrador:");

if(senha !== senhaSalva){

    alert("Senha incorreta!");

    location.href="../index.html";

}


/* =====================================================
   LOCALIZAR CONFIGURAÇÃO
===================================================== */

async function buscarConfiguracao(){

    const { data, error } =
        await supabaseClient
        .from("configuracao")
        .select("*")
        .order("id",{ascending:false})
        .limit(1);

    if(error){

        throw error;

    }

    if(!data || data.length === 0){

        return null;

    }

    return data[0];

}


/* =====================================================
   CARREGAR CONFIGURAÇÕES
===================================================== */

async function carregarConfiguracoes(){

    try{

        const config =
            await buscarConfiguracao();

        if(!config){

            console.log(
                "Nenhuma configuração encontrada."
            );

            return;

        }


        /* LOTERIA */

        document.getElementById("premio").value =
            config.premio || "";

        document.getElementById("valorAposta").value =
            config.valor_aposta || "";

        document.getElementById("pixLoteria").value =
            config.pix || "";

        document.getElementById("data").value =
            config.data_sorteio || "";

        document.getElementById("hora").value =
            config.hora_sorteio || "";

        document.getElementById("mensagem").value =
            config.mensagem || "";


        /* RIFA */

        document.getElementById("valorRifa").value =
            config.valor_rifa || "";

        document.getElementById("premioRifa").value =
            config.premio_rifa || "";

        document.getElementById("pixRifa").value =
            config.pix_rifa || "";


        /* SALVA CÓPIA LOCAL */

        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify({

                valor:config.valor_rifa || "",

                premio:config.premio_rifa || "",

                pix:config.pix_rifa || ""

            })
        );


        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:config.premio || "",

                valorAposta:
                    config.valor_aposta || "",

                pix:config.pix || "",

                data:
                    config.data_sorteio || "",

                hora:
                    config.hora_sorteio || "",

                mensagem:
                    config.mensagem || ""

            })
        );


    }catch(error){

        console.error(
            "Erro ao carregar configurações:",
            error
        );

        alert(
            "❌ Erro ao carregar configurações:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   SALVAR LOTERIA
===================================================== */

async function salvarConfiguracoes(){

    try{

        const config =
            await buscarConfiguracao();

        if(!config){

            alert(
                "❌ Não existe configuração cadastrada no Supabase."
            );

            return;

        }


        const dados = {

            premio:
                document.getElementById("premio").value,

            valor_aposta:
                document.getElementById("valorAposta").value,

            pix:
                document.getElementById("pixLoteria").value,

            data_sorteio:
                document.getElementById("data").value,

            hora_sorteio:
                document.getElementById("hora").value,

            mensagem:
                document.getElementById("mensagem").value

        };


        const { error } =
            await supabaseClient
            .from("configuracao")
            .update(dados)
            .eq("id",config.id);


        if(error){

            throw error;

        }


        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:dados.premio,

                valorAposta:
                    dados.valor_aposta,

                pix:dados.pix,

                data:
                    dados.data_sorteio,

                hora:
                    dados.hora_sorteio,

                mensagem:
                    dados.mensagem

            })
        );


        alert(
            "🍀 Configurações da Loteria salvas!"
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao salvar Loteria:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   SALVAR RIFA
===================================================== */

async function salvarRifa(){

    try{

        const config =
            await buscarConfiguracao();

        if(!config){

            alert(
                "❌ Configuração principal não encontrada."
            );

            return;

        }


        const valor =
            document.getElementById(
                "valorRifa"
            ).value.trim();


        const premio =
            document.getElementById(
                "premioRifa"
            ).value.trim();


        const pix =
            document.getElementById(
                "pixRifa"
            ).value.trim();


        const { error } =
            await supabaseClient

            .from("configuracao")

            .update({

                valor_rifa:valor,

                premio_rifa:premio,

                pix_rifa:pix

            })

            .eq("id",config.id);


        if(error){

            throw error;

        }


        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify({

                valor:valor,

                premio:premio,

                pix:pix

            })
        );


        document.getElementById(
            "resultadoRifa"
        ).innerHTML =

            "<p class='sucesso'>" +
            "✅ Rifa salva com sucesso!" +
            "</p>";


        alert(
            "🎟️ Configuração da Rifa salva no Supabase! 🍀"
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao salvar Rifa:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   ALTERAR SENHA
===================================================== */

function alterarSenha(){

    let novaSenha =
        prompt("Digite a nova senha:");

    if(!novaSenha){

        return;

    }

    localStorage.setItem(
        "senhaAdmin",
        novaSenha
    );

    alert(
        "🔐 Senha alterada com sucesso!"
    );

}


/* =====================================================
   APOSTAS LOTERIA
===================================================== */

async function carregarApostas(){

    const lista =
        document.getElementById("lista");

    try{

        const { data,error } =
            await supabaseClient

            .from("participantes")

            .select("*")

            .order("id",{ascending:false});


        if(error){

            throw error;

        }


        if(!data || data.length === 0){

            lista.innerHTML =
                "Nenhuma aposta registrada 🍀";

            document.getElementById(
                "financeiro"
            ).innerHTML =
                "Nenhuma aposta registrada.";

            return;

        }


        let html = "";

        let pagos = 0;


        data.forEach(function(p){

            if(
                p.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }


            html += `

            <div class="aposta">

            👤 <b>
            ${p.nome || "Não informado"}
            </b>

            <br><br>

            📱 WhatsApp:
            <br>
            ${p.whatsapp || "Não informado"}

            <br><br>

            🍀 Números:
            <br>
            ${p.numeros || "Não informado"}

            <br><br>

            💰 Status:
            <br>

            <span class="status">
            ${p.pagamento ||
            "🟡 Aguardando pagamento"}
            </span>

            <br><br>

            <button
            onclick="confirmarPagamento(${p.id})">

            ✅ Confirmar pagamento

            </button>

            </div>

            `;

        });


        lista.innerHTML =
            html;


        const config =
            await buscarConfiguracao();


        const valor =
            Number(
                config?.valor_aposta
            ) || 0;


        const premio =
            Number(
                config?.premio
            ) || 0;


        const arrecadado =
            pagos * valor;


        const saldo =
            arrecadado - premio;


        document.getElementById(
            "financeiro"
        ).innerHTML =

        "🎟️ Total de apostas: " +
        data.length +

        "<br><br>" +

        "🟢 Pagamentos confirmados: " +
        pagos +

        "<br><br>" +

        "💰 Arrecadado: R$ " +
        arrecadado.toFixed(2) +

        "<br><br>" +

        "🏆 Prêmio: R$ " +
        premio.toFixed(2) +

        "<br><br>" +

        "📈 Saldo: R$ " +
        saldo.toFixed(2);


    }catch(error){

        console.error(error);

        lista.innerHTML =
            "❌ Erro ao carregar apostas:<br><br>" +
            error.message;

    }

}


/* =====================================================
   CONFIRMAR PAGAMENTO
===================================================== */

async function confirmarPagamento(id){

    if(!confirm(
        "Confirmar o pagamento desta aposta?"
    )){

        return;

    }


    try{

        const { error } =
            await supabaseClient

            .from("participantes")

            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })

            .eq("id",id);


        if(error){

            throw error;

        }


        alert(
            "🟢 Pagamento confirmado!"
        );


        carregarApostas();


    }catch(error){

        alert(
            "❌ Erro:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   CARREGAR RIFA
===================================================== */

async function carregarRifa(){

    const vendas =
        document.getElementById(
            "vendasRifa"
        );


    try{

        const { data,error } =
            await supabaseClient

            .from("rifa_participantes")

            .select("*")

            .order("id",{ascending:false});


        if(error){

            throw error;

        }


        const rifa =
            data || [];


        if(rifa.length === 0){

            vendas.innerHTML =
                "Nenhuma venda de rifa realizada.";

        }else{

            let html = "";

            rifa.forEach(function(r){

                html += `

                <div class="aposta">

                👤 <b>
                ${r.nome || "Não informado"}
                </b>

                <br><br>

                📱
                ${r.whatsapp || "Não informado"}

                <br><br>

                🎟️ Número:
                <br>

                <b>
                ${String(r.numero).padStart(2,"0")}
                </b>

                <br><br>

                💰 Status:
                <br>

                ${r.pagamento ||
                "🟡 Aguardando pagamento"}

                <br><br>

                <button
                onclick="confirmarPagamentoRifa(${r.id})">

                ✅ Confirmar pagamento

                </button>

                </div>

                `;

            });


            vendas.innerHTML =
                html;

        }


        const config =
            await buscarConfiguracao();


        const valor =
            Number(
                config?.valor_rifa
            ) || 0;


        const premio =
            Number(
                config?.premio_rifa
            ) || 0;


        let pagos = 0;


        rifa.forEach(function(r){

            if(
                r.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }

        });


        const arrecadado =
            pagos * valor;


        const lucro =
            arrecadado - premio;


        document.getElementById(
            "financeiroRifa"
        ).innerHTML =

        "💰 Valor por número: R$ " +
        valor.toFixed(2) +

        "<br><br>" +

        "🎟️ Reservados: " +
        rifa.length +
        " / 100" +

        "<br><br>" +

        "🟢 Pagos: " +
        pagos +

        "<br><br>" +

        "💵 Arrecadado: R$ " +
        arrecadado.toFixed(2) +

        "<br><br>" +

        "🏆 Prêmio: R$ " +
        premio.toFixed(2) +

        "<br><br>" +

        "📈 Lucro: R$ " +
        lucro.toFixed(2);


    }catch(error){

        console.error(error);

        vendas.innerHTML =
            "❌ Erro ao carregar Rifa:<br><br>" +
            error.message;

    }

}


/* =====================================================
   CONFIRMAR PAGAMENTO RIFA
===================================================== */

async function confirmarPagamentoRifa(id){

    if(!confirm(
        "Confirmar pagamento desta Rifa?"
    )){

        return;

    }


    try{

        const { error } =
            await supabaseClient

            .from("rifa_participantes")

            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })

            .eq("id",id);


        if(error){

            throw error;

        }


        alert(
            "🟢 Pagamento da Rifa confirmado!"
        );


        carregarRifa();


    }catch(error){

        alert(
            "❌ Erro:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   SORTEIO LOTERIA
===================================================== */

async function realizarSorteio(){

    let numeros = [];


    while(numeros.length < 4){

        let n =
            Math.floor(
                Math.random() * 15
            ) + 1;


        if(!numeros.includes(n)){

            numeros.push(n);

        }

    }


    numeros.sort(
        (a,b)=>a-b
    );


    alert(
        "🍀 Sorteio realizado!\n\n" +
        "Números:\n" +
        numeros.join(" - ")
    );

}


/* =====================================================
   SORTEIO RIFA
===================================================== */

async function sortearRifa(){

    try{

        const { data,error } =
            await supabaseClient

            .from("rifa_participantes")

            .select("*");


        if(error){

            throw error;

        }


        const rifa =
            data || [];


        if(rifa.length < 100){

            alert(
                "🍀 Ainda não é possível realizar o sorteio.\n\n" +
                "Reservados: " +
                rifa.length +
                "\n\nFaltam: " +
                (100-rifa.length)
            );

            return;

        }


        const vencedor =
            rifa[
                Math.floor(
                    Math.random() *
                    rifa.length
                )
            ];


        alert(

            "🎉 RIFA SORTEADA!\n\n" +

            "🎟️ Número: " +
            vencedor.numero +

            "\n👤 Ganhador: " +
            vencedor.nome

        );


    }catch(error){

        alert(
            "❌ Erro ao sortear Rifa:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   HISTÓRICO
===================================================== */

function apagarHistorico(){

    if(
        confirm(
            "Apagar histórico deste aparelho?"
        )
    ){

        localStorage.removeItem(
            "historicoSorteios"
        );

        alert(
            "Histórico local apagado 🍀"
        );

    }

}


/* =====================================================
   INICIAR
===================================================== */

carregarConfiguracoes();

carregarApostas();

carregarRifa();

</script>

</body>
</html>
