<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Trevo4Folhas 🍀</title>


<style>

body{

font-family:Arial,sans-serif;

background:#111;

color:white;

text-align:center;

padding:20px;

}


.caixa{

background:#222;

padding:15px;

border-radius:10px;

margin:10px auto;

max-width:400px;

}


input{

width:90%;

padding:10px;

margin:5px;

border-radius:8px;

border:none;

}


button{

background:#0b8f3a;

color:white;

border:none;

border-radius:8px;

padding:10px 15px;

margin-top:10px;

cursor:pointer;

font-weight:bold;

}


</style>


<script>


let senhaSalva =

localStorage.getItem("senhaAdmin") || "trevo123";


let senha = prompt(

"Digite a senha do administrador:"

);



if(senha !== senhaSalva){


alert("Senha incorreta!");


window.location.href="../index.html";


}



function salvarConfiguracoes(){


let configuracao = {


premio:

document.getElementById("premio").value,


valorAposta:

document.getElementById("valorAposta").value,


data:

document.getElementById("data").value,


hora:

document.getElementById("hora").value,


mensagem:

document.getElementById("mensagem").value


};



localStorage.setItem(

"configuracao",

JSON.stringify(configuracao)

);



alert("Configurações salvas 🍀");


}


function alterarSenha(){


let novaSenha = prompt(

"Digite a nova senha:"

);



if(!novaSenha){

return;

}


localStorage.setItem(

"senhaAdmin",

novaSenha

);



alert("Senha alterada com sucesso!");

}


</script>


</head>


<body>


<h1>

🔐 Admin Trevo4Folhas 🍀

</h1>


<div class="caixa">


<h3>

⚙️ Configurações do Sorteio

</h3>


<input id="premio" placeholder="Valor do prêmio">


<input id="valorAposta" placeholder="Valor da aposta">


<input id="data" placeholder="Data do sorteio">


<input id="hora" placeholder="Hora do sorteio">


<input id="mensagem" placeholder="Mensagem">


<button onclick="salvarConfiguracoes()">

💾 Salvar Configurações

</button>


<button onclick="alterarSenha()">

🔐 Alterar Senha

</button>


</div>
