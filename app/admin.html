<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Trevo4Folhas 🍀</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    color:#6dff7d;
    margin-bottom:20px;
    text-shadow:0 0 10px #00ff55;
}

.caixa{
    background:#222;
    padding:18px;
    border-radius:12px;
    margin:15px auto;
    max-width:450px;
    box-shadow:0 0 12px #000;
}

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:8px;
    border:none;
    font-size:16px;
}

button{
    background:#0b8f3a;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 18px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
    width:90%;
    max-width:400px;
}

button:active{
    transform:scale(.97);
}

.aposta{
    background:#333;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.status{
    display:inline-block;
    padding:8px;
    border-radius:8px;
    background:#111;
}

.sucesso{
    color:#6dff7d;
}

.erro{
    color:#ff6666;
}

</style>

</head>

<body>

<h1>🔐 Admin Trevo4Folhas 🍀</h1>


<!-- =====================================
CONFIGURAÇÕES DA LOTERIA
===================================== -->

<div class="caixa">

<h3>⚙️ Configurações da Loteria</h3>

<input
id="premio"
placeholder="Valor do prêmio">

<input
id="valorAposta"
placeholder="Valor da aposta">

<input
id="pixLoteria"
placeholder="Chave Pix da Loteria">

<input
id="data"
placeholder="Data do sorteio">

<input
id="hora"
placeholder="Hora do sorteio">

<input
id="mensagem"
placeholder="Mensagem">

<button onclick="salvarConfiguracoes()">
💾 Salvar Configurações
</button>

</div>


<!-- =====================================
FINANCEIRO
===================================== -->

<div class="caixa">

<h3>💰 Financeiro da Loteria</h3>

<div id="financeiro">
⏳ Carregando...
</div>

</div>


<!-- =====================================
APOSTAS
===================================== -->

<div class="caixa">

<h3>🍀 Apostas da Loteria</h3>

<div id="lista">
⏳ Carregando apostas...
</div>

</div>


<br>


<button onclick="realizarSorteio()">
🎲 Realizar Sorteio
</button>


<br>


<button onclick="apagarHistorico()">
🗑️ Apagar Histórico
</button>


<br><br>


<button onclick="alterarSenha()">
🔐 Alterar Senha
</button>


<br><br>


<button onclick="location.href='../index.html'">
🏠 Voltar ao início
</button>


<!-- =====================================
SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

// =====================================
// SENHA DO ADMIN
// =====================================

let senhaSalva =
localStorage.getItem("senhaAdmin") || "trevo123";

let senha =
prompt("Digite a senha do administrador:");

if(senha !== senhaSalva){

    alert("❌ Senha incorreta!");

    location.href="../index.html";

}


// =====================================
// CARREGAR CONFIGURAÇÕES
// =====================================

async function carregarConfiguracoes(){

    try{

        const resultado =
            await supabaseClient
            .from("configuracao")
            .select(
                "id,premio,valor_aposta,pix,data_sorteio,hora_sorteio,mensagem"
            )
            .limit(1);


        if(resultado.error){

            throw resultado.error;

        }


        // =================================
        // SE NÃO EXISTIR CONFIGURAÇÃO
        // =================================

        if(
            !resultado.data ||
            resultado.data.length === 0
        ){

            document.getElementById("premio").value = "";
            document.getElementById("valorAposta").value = "";
            document.getElementById("pixLoteria").value = "";
            document.getElementById("data").value = "";
            document.getElementById("hora").value = "";
            document.getElementById("mensagem").value = "";


            document.getElementById(
                "financeiro"
            ).innerHTML =

                "⚠️ Nenhuma configuração cadastrada ainda.";

            return;

        }


        const config =
            resultado.data[0];


        // =================================
        // PREENCHER CAMPOS
        // =================================

        document.getElementById("premio").value =
            config.premio || "";


        document.getElementById("valorAposta").value =
            config.valor_aposta || "";


        document.getElementById("pixLoteria").value =
            config.pix || "";


        document.getElementById("data").value =
            config.data_sorteio || "";


        document.getElementById("hora").value =
            config.hora_sorteio || "";


        document.getElementById("mensagem").value =
            config.mensagem || "";


        // =================================
        // SALVAR CÓPIA LOCAL
        // =================================

        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:
                    config.premio || "",

                valorAposta:
                    config.valor_aposta || "",

                pix:
                    config.pix || "",

                data:
                    config.data_sorteio || "",

                hora:
                    config.hora_sorteio || "",

                mensagem:
                    config.mensagem || ""

            })
        );


        console.log(
            "✅ Configuração carregada:",
            config
        );


    }catch(error){

        console.error(
            "Erro ao carregar configuração:",
            error
        );


        document.getElementById(
            "financeiro"
        ).innerHTML =

            "❌ Erro ao carregar configuração:<br><br>" +
            error.message;

    }

}


// =====================================
// SALVAR CONFIGURAÇÕES
// =====================================

async function salvarConfiguracoes(){

    const premio =
        document.getElementById("premio").value.trim();


    const valorAposta =
        document.getElementById("valorAposta").value.trim();


    const pix =
        document.getElementById("pixLoteria").value.trim();


    const data =
        document.getElementById("data").value.trim();


    const hora =
        document.getElementById("hora").value.trim();


    const mensagem =
        document.getElementById("mensagem").value.trim();


    try{

        // =================================
        // PROCURAR CONFIGURAÇÃO
        // =================================

        const resultado =
            await supabaseClient
            .from("configuracao")
            .select("id")
            .limit(1);


        if(resultado.error){

            throw resultado.error;

        }


        // =================================
        // SE NÃO EXISTIR, CRIA
        // =================================

        if(
            !resultado.data ||
            resultado.data.length === 0
        ){

            const novo =
                await supabaseClient
                .from("configuracao")
                .insert([{

                    premio:
                        premio,

                    valor_aposta:
                        valorAposta,

                    pix:
                        pix,

                    data_sorteio:
                        data,

                    hora_sorteio:
                        hora,

                    mensagem:
                        mensagem

                }]);


            if(novo.error){

                throw novo.error;

            }


        }else{

            // =================================
            // SE EXISTIR, ATUALIZA
            // =================================

            const id =
                resultado.data[0].id;


            const atualizacao =
                await supabaseClient
                .from("configuracao")
                .update({

                    premio:
                        premio,

                    valor_aposta:
                        valorAposta,

                    pix:
                        pix,

                    data_sorteio:
                        data,

                    hora_sorteio:
                        hora,

                    mensagem:
                        mensagem

                })
                .eq("id",id);


            if(atualizacao.error){

                throw atualizacao.error;

            }

        }


        // =================================
        // SALVAR LOCALMENTE
        // =================================

        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:
                    premio,

                valorAposta:
                    valorAposta,

                pix:
                    pix,

                data:
                    data,

                hora:
                    hora,

                mensagem:
                    mensagem

            })
        );


        alert(
            "✅ Configurações salvas com sucesso! 🍀"
        );


        await carregarConfiguracoes();

        await carregarApostas();


    }catch(error){

        console.error(
            "ERRO AO SALVAR:",
            error
        );


        alert(
            "❌ Não foi possível salvar as configurações.\n\n" +
            error.message
        );

    }

}


// =====================================
// ALTERAR SENHA
// =====================================

function alterarSenha(){

    let novaSenha =
        prompt("Digite a nova senha:");

    if(!novaSenha){
        return;
    }


    localStorage.setItem(
        "senhaAdmin",
        novaSenha
    );


    alert(
        "🔐 Senha alterada com sucesso!"
    );

}


// =====================================
// CARREGAR APOSTAS
// =====================================

async function carregarApostas(){

    const lista =
        document.getElementById("lista");


    try{

        const resultado =
            await supabaseClient
            .from("participantes")
            .select("*")
            .order(
                "id",
                {
                    ascending:false
                }
            );


        if(resultado.error){

            throw resultado.error;

        }


        const data =
            resultado.data || [];


        if(data.length === 0){

            lista.innerHTML =
                "Nenhuma aposta registrada 🍀";


            document.getElementById(
                "financeiro"
            ).innerHTML =
                "Nenhuma aposta registrada.";

            return;

        }


        let html = "";

        let pagos = 0;


        data.forEach(function(p){

            if(
                p.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }


            html += `

            <div class="aposta">

            👤 <b>
            ${p.nome || "Não informado"}
            </b>

            <br><br>

            📱 WhatsApp:
            <br>

            ${p.whatsapp || "Não informado"}

            <br><br>

            💳 Pix:
            <br>

            ${p.pix || "Não informado"}

            <br><br>

            📍 Cidade:
            <br>

            ${p.cidade || "Não informado"}

            <br><br>

            🍀 Números:
            <br>

            ${p.numeros || "Não informado"}

            <br><br>

            💰 Status:
            <br>

            <span class="status">

            ${p.pagamento ||
            "🟡 Aguardando pagamento"}

            </span>

            <br><br>

            <button
            onclick="confirmarPagamento(${p.id})">

            ✅ Confirmar pagamento

            </button>

            </div>

            `;

        });


        lista.innerHTML =
            html;


        calcularFinanceiro(
            data.length,
            pagos
        );


    }catch(error){

        console.error(
            "Erro ao carregar apostas:",
            error
        );


        lista.innerHTML =

            "❌ Erro ao carregar apostas:<br><br>" +
            error.message;

    }

}


// =====================================
// CALCULAR FINANCEIRO
// =====================================

function calcularFinanceiro(
    totalApostas,
    pagos
){

    let valorTexto =
        document.getElementById(
            "valorAposta"
        ).value;


    let premioTexto =
        document.getElementById(
            "premio"
        ).value;


    let valor =
        converterNumero(
            valorTexto
        );


    let premio =
        converterNumero(
            premioTexto
        );


    let arrecadado =
        pagos * valor;


    let saldo =
        arrecadado - premio;


    document.getElementById(
        "financeiro"
    ).innerHTML =

        "🎟️ Total de apostas: " +
        totalApostas +

        "<br><br>" +

        "🟢 Pagamentos confirmados: " +
        pagos +

        "<br><br>" +

        "💰 Arrecadado: R$ " +
        formatarNumero(arrecadado) +

        "<br><br>" +

        "🏆 Prêmio: R$ " +
        formatarNumero(premio) +

        "<br><br>" +

        "📈 Saldo: R$ " +
        formatarNumero(saldo);

}


// =====================================
// CONVERTER VALOR
// =====================================

function converterNumero(valor){

    if(!valor){
        return 0;
    }


    let texto =
        String(valor)
        .trim()
        .replace("R$","")
        .trim();


    if(
        texto.includes(",") &&
        texto.includes(".")
    ){

        texto =
            texto
            .replace(/\./g,"")
            .replace(",",".");
    }

    else if(
        texto.includes(",")
    ){

        texto =
            texto.replace(",",".");
    }


    return Number(texto) || 0;

}


// =====================================
// FORMATAR VALOR
// =====================================

function formatarNumero(valor){

    return Number(valor)
        .toFixed(2)
        .replace(".",",");

}


// =====================================
// CONFIRMAR PAGAMENTO
// =====================================

async function confirmarPagamento(id){

    if(
        !confirm(
            "Confirmar o pagamento desta aposta?"
        )
    ){

        return;

    }


    try{

        const resultado =
            await supabaseClient
            .from("participantes")
            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })
            .eq("id",id);


        if(resultado.error){

            throw resultado.error;

        }


        alert(
            "🟢 Pagamento confirmado!"
        );


        await carregarApostas();


    }catch(error){

        console.error(error);


        alert(
            "❌ Erro ao confirmar pagamento:\n\n" +
            error.message
        );

    }

}


// =====================================
// REALIZAR SORTEIO
// =====================================

async function realizarSorteio(){

    let numeros = [];


    while(
        numeros.length < 4
    ){

        let n =
            Math.floor(
                Math.random() * 15
            ) + 1;


        if(
            !numeros.includes(n)
        ){

            numeros.push(n);

        }

    }


    numeros.sort(
        (a,b)=>a-b
    );


    try{

        const resultadoBusca =
            await supabaseClient
            .from("participantes")
            .select("*");


        if(resultadoBusca.error){

            throw resultadoBusca.error;

        }


        const data =
            resultadoBusca.data || [];


        let vencedores = [];


        data.forEach(function(p){

            if(
                p.pagamento !==
                "🟢 Pagamento confirmado"
            ){

                return;

            }


            let aposta;


            try{

                aposta =
                    JSON.parse(p.numeros);

            }catch(e){

                return;

            }


            if(
                Array.isArray(aposta) &&
                aposta.length === 4 &&
                aposta.every(
                    function(n){

                        return numeros.includes(
                            Number(n)
                        );

                    }
                )
            ){

                vencedores.push(
                    p.nome
                );

            }

        });


        let configuracao =
            JSON.parse(
                localStorage.getItem(
                    "configuracao"
                )
            ) || {};


        let resultado = {

            numeros:
                numeros,

            data:
                new Date()
                .toLocaleString(
                    "pt-BR"
                ),

            premio:
                configuracao.premio ||
                "Não informado",

            vencedores:
                vencedores.length > 0
                ? vencedores
                : ["🍀 Acumulou"]

        };


        localStorage.setItem(
            "resultadoSorteio",
            JSON.stringify(
                resultado
            )
        );


        let historico =
            JSON.parse(
                localStorage.getItem(
                    "historicoSorteios"
                )
            ) || [];


        historico.push(
            resultado
        );


        localStorage.setItem(
            "historicoSorteios",
            JSON.stringify(
                historico
            )
        );


        alert(

            "🍀 Sorteio realizado!\n\n" +

            "Números:\n" +

            numeros.join(" - ")

        );


    }catch(error){

        console.error(error);


        alert(

            "❌ Erro ao realizar sorteio:\n\n" +

            error.message

        );

    }

}


// =====================================
// APAGAR HISTÓRICO
// =====================================

function apagarHistorico(){

    if(
        confirm(
            "Apagar o histórico de sorteios deste aparelho?"
        )
    ){

        localStorage.removeItem(
            "historicoSorteios"
        );


        localStorage.removeItem(
            "resultadoSorteio"
        );


        alert(
            "📚 Histórico apagado!"
        );

    }

}


// =====================================
// INICIAR
// =====================================

carregarConfiguracoes();

carregarApostas();

</script>

</body>

</html>
