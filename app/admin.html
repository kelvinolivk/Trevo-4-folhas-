<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Trevo4Folhas 🍀</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    color:#6dff7d;
    margin-bottom:20px;
}

.caixa{
    background:#222;
    padding:18px;
    border-radius:12px;
    margin:15px auto;
    max-width:450px;
    box-shadow:0 0 10px #000;
}

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:8px;
    border:none;
    font-size:16px;
}

button{
    background:#0b8f3a;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 18px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
    width:100%;
}

button:active{
    transform:scale(.98);
}

.aposta{
    background:#333;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.status{
    display:inline-block;
    padding:8px;
    border-radius:8px;
    background:#111;
}

.erro{
    color:#ff6666;
}

.sucesso{
    color:#6dff7d;
}

.pequeno{
    font-size:14px;
    color:#aaa;
    margin-top:8px;
}

</style>

</head>

<body>

<h1>🔐 Admin Trevo4Folhas 🍀</h1>


<!-- =====================================
CONFIGURAÇÃO DA LOTERIA
===================================== -->

<div class="caixa">

<h3>⚙️ Configurações da Loteria</h3>

<input
id="premio"
placeholder="Valor do prêmio">

<input
id="valorAposta"
placeholder="Valor da aposta">

<input
id="pixLoteria"
placeholder="Chave Pix da Loteria">

<input
id="data"
placeholder="Data do sorteio">

<input
id="hora"
placeholder="Hora do sorteio">

<input
id="mensagem"
placeholder="Mensagem">

<button onclick="salvarConfiguracoes()">
💾 Salvar Configurações
</button>

<div class="pequeno">
O Pix é salvo separadamente para evitar erro de coluna no Supabase.
</div>

</div>


<!-- =====================================
FINANCEIRO
===================================== -->

<div class="caixa">

<h3>💰 Financeiro da Loteria</h3>

<div id="financeiro">
⏳ Carregando...
</div>

</div>


<!-- =====================================
APOSTAS
===================================== -->

<div class="caixa">

<h3>🍀 Apostas da Loteria</h3>

<div id="lista">
⏳ Carregando apostas...
</div>

</div>


<br>

<button onclick="realizarSorteio()">
🎲 Realizar Sorteio
</button>

<br>

<button onclick="apagarHistorico()">
🗑️ Apagar Histórico
</button>

<br><br>

<button onclick="alterarSenha()">
🔐 Alterar Senha
</button>

<br><br>

<button onclick="location.href='../index.html'">
🏠 Voltar ao início
</button>


<!-- =====================================
SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


// =====================================
// SENHA DO ADMIN
// =====================================

let senhaSalva =
localStorage.getItem("senhaAdmin") || "trevo123";

let senha =
prompt("Digite a senha do administrador:");

if(senha !== senhaSalva){

    alert("Senha incorreta!");

    location.href="../index.html";

}


// =====================================
// CARREGAR CONFIGURAÇÃO
// =====================================

async function carregarConfiguracoes(){

    try{

        const { data, error } =

            await supabaseClient
            .from("configuracao")
            .select(
                "id,premio,valor_aposta,data_sorteio,hora_sorteio,mensagem"
            )
            .limit(1);


        if(error){

            throw error;

        }


        if(!data || data.length === 0){

            document.getElementById("premio").value="";
            document.getElementById("valorAposta").value="";
            document.getElementById("data").value="";
            document.getElementById("hora").value="";
            document.getElementById("mensagem").value="";

            document.getElementById("pixLoteria").value =
                localStorage.getItem("pixLoteria") || "";

            return;

        }


        let config = data[0];


        // =================================
        // PREENCHER CAMPOS
        // =================================

        document.getElementById("premio").value =
            config.premio || "";

        document.getElementById("valorAposta").value =
            config.valor_aposta || "";

        document.getElementById("data").value =
            config.data_sorteio || "";

        document.getElementById("hora").value =
            config.hora_sorteio || "";

        document.getElementById("mensagem").value =
            config.mensagem || "";


        // =================================
        // PIX
        // =================================

        document.getElementById("pixLoteria").value =
            localStorage.getItem("pixLoteria") || "";


        // =================================
        // SALVAR CÓPIA LOCAL
        // =================================

        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:
                    config.premio || "",

                valorAposta:
                    config.valor_aposta || "",

                pix:
                    localStorage.getItem("pixLoteria") || "",

                data:
                    config.data_sorteio || "",

                hora:
                    config.hora_sorteio || "",

                mensagem:
                    config.mensagem || ""

            })
        );


        console.log(
            "Configuração carregada:",
            config
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao carregar configuração:\n\n" +
            error.message
        );

    }

}


// =====================================
// SALVAR CONFIGURAÇÕES
// =====================================

async function salvarConfiguracoes(){

    let premio =
        document.getElementById("premio").value.trim();


    let valorAposta =
        document.getElementById("valorAposta").value.trim();


    let pix =
        document.getElementById("pixLoteria").value.trim();


    let data =
        document.getElementById("data").value.trim();


    let hora =
        document.getElementById("hora").value.trim();


    let mensagem =
        document.getElementById("mensagem").value.trim();


    // =================================
    // PIX NÃO VAI PARA A TABELA
    // =================================

    localStorage.setItem(
        "pixLoteria",
        pix
    );


    try{

        // ==============================
        // VERIFICAR CONFIGURAÇÃO
        // ==============================

        const { data:existente, error:erroBusca } =

            await supabaseClient
            .from("configuracao")
            .select("id")
            .limit(1);


        if(erroBusca){

            throw erroBusca;

        }


        // ==============================
        // SE NÃO EXISTIR
        // ==============================

        if(!existente || existente.length === 0){

            const { error:erroInsert } =

                await supabaseClient
                .from("configuracao")
                .insert([{

                    premio:
                        premio,

                    valor_aposta:
                        valorAposta,

                    data_sorteio:
                        data,

                    hora_sorteio:
                        hora,

                    mensagem:
                        mensagem

                }]);


            if(erroInsert){

                throw erroInsert;

            }

        }else{

            // ==========================
            // ATUALIZAR
            // ==========================

            const id =
                existente[0].id;


            const { error:erroUpdate } =

                await supabaseClient
                .from("configuracao")
                .update({

                    premio:
                        premio,

                    valor_aposta:
                        valorAposta,

                    data_sorteio:
                        data,

                    hora_sorteio:
                        hora,

                    mensagem:
                        mensagem

                })
                .eq("id",id);


            if(erroUpdate){

                throw erroUpdate;

            }

        }


        // =================================
        // SALVAR TUDO LOCALMENTE
        // =================================

        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:
                    premio,

                valorAposta:
                    valorAposta,

                pix:
                    pix,

                data:
                    data,

                hora:
                    hora,

                mensagem:
                    mensagem

            })
        );


        alert(
            "🍀 Configurações salvas com sucesso!"
        );


    }catch(error){

        console.error(
            "ERRO AO SALVAR:",
            error
        );


        alert(
            "❌ Não foi possível salvar.\n\n" +
            error.message
        );

    }

}


// =====================================
// ALTERAR SENHA
// =====================================

function alterarSenha(){

    let novaSenha =
        prompt("Digite a nova senha:");


    if(!novaSenha){

        return;

    }


    localStorage.setItem(
        "senhaAdmin",
        novaSenha
    );


    alert(
        "🔐 Senha alterada com sucesso!"
    );

}


// =====================================
// CARREGAR APOSTAS
// =====================================

async function carregarApostas(){

    let lista =
        document.getElementById("lista");


    try{

        const { data, error } =

            await supabaseClient
            .from("participantes")
            .select("*")
            .order(
                "id",
                {ascending:false}
            );


        if(error){

            throw error;

        }


        if(!data || data.length === 0){

            lista.innerHTML =
                "Nenhuma aposta registrada 🍀";


            document.getElementById(
                "financeiro"
            ).innerHTML =
                "Nenhuma aposta registrada.";


            return;

        }


        let html = "";

        let pagos = 0;


        data.forEach(function(p){


            if(
                p.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }


            html += `

            <div class="aposta">

            👤 <b>
            ${p.nome || "Não informado"}
            </b>

            <br><br>

            📱 WhatsApp:
            <br>
            ${p.whatsapp || "Não informado"}

            <br><br>

            📍 Cidade:
            <br>
            ${p.cidade || "Não informado"}

            <br><br>

            🍀 Números:
            <br>
            ${p.numeros || "Não informado"}

            <br><br>

            💰 Status:
            <br>

            <span class="status">
            ${p.pagamento ||
            "🟡 Aguardando pagamento"}
            </span>

            <br><br>

            <button
            onclick="confirmarPagamento(${p.id})">

            ✅ Confirmar pagamento

            </button>

            </div>

            `;

        });


        lista.innerHTML =
            html;


        // =================================
        // FINANCEIRO
        // =================================

        let valorTexto =
            document.getElementById(
                "valorAposta"
            ).value;


        let valorAposta =
            Number(
                String(valorTexto)
                .replace("R$","")
                .replace(/\./g,"")
                .replace(",",".")
            ) || 0;


        let arrecadado =
            pagos * valorAposta;


        let premioTexto =
            document.getElementById(
                "premio"
            ).value;


        let premio =
            Number(
                String(premioTexto)
                .replace("R$","")
                .replace(/\./g,"")
                .replace(",",".")
            ) || 0;


        let saldo =
            arrecadado - premio;


        document.getElementById(
            "financeiro"
        ).innerHTML =

        "🎟️ Total de apostas: " +
        data.length +

        "<br><br>" +

        "🟢 Pagamentos confirmados: " +
        pagos +

        "<br><br>" +

        "💰 Arrecadado: R$ " +
        arrecadado.toFixed(2).replace(".",",") +

        "<br><br>" +

        "🏆 Prêmio: R$ " +
        premio.toFixed(2).replace(".",",") +

        "<br><br>" +

        "📈 Saldo: R$ " +
        saldo.toFixed(2).replace(".",",");


    }catch(error){

        console.error(error);


        lista.innerHTML =
            "❌ Erro ao carregar apostas:<br><br>" +
            error.message;

    }

}


// =====================================
// CONFIRMAR PAGAMENTO
// =====================================

async function confirmarPagamento(id){

    if(
        !confirm(
            "Confirmar o pagamento desta aposta?"
        )
    ){

        return;

    }


    try{

        const { error } =

            await supabaseClient
            .from("participantes")
            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })
            .eq("id",id);


        if(error){

            throw error;

        }


        alert(
            "🟢 Pagamento confirmado!"
        );


        carregarApostas();


    }catch(error){

        console.error(error);


        alert(
            "❌ Erro ao confirmar pagamento:\n\n" +
            error.message
        );

    }

}


// =====================================
// SORTEIO
// =====================================

async function realizarSorteio(){

    let numeros = [];


    while(numeros.length < 4){

        let n =
            Math.floor(
                Math.random() * 15
            ) + 1;


        if(!numeros.includes(n)){

            numeros.push(n);

        }

    }


    numeros.sort(
        (a,b)=>a-b
    );


    try{

        const { data, error } =

            await supabaseClient
            .from("participantes")
            .select("*");


        if(error){

            throw error;

        }


        let vencedores = [];


        data.forEach(function(p){

            if(
                p.pagamento !==
                "🟢 Pagamento confirmado"
            ){

                return;

            }


            let aposta;


            try{

                aposta =
                    JSON.parse(p.numeros);

            }catch(e){

                return;

            }


            if(
                Array.isArray(aposta) &&
                aposta.every(
                    n =>
                    numeros.includes(
                        Number(n)
                    )
                )
            ){

                vencedores.push(
                    p.nome
                );

            }

        });


        let configuracao =
            JSON.parse(
                localStorage.getItem(
                    "configuracao"
                )
            ) || {};


        let resultado = {

            numeros:
                numeros,

            data:
                new Date()
                .toLocaleDateString(
                    "pt-BR"
                ),

            premio:
                configuracao.premio ||
                "Não informado",

            vencedores:
                vencedores.length > 0
                ? vencedores
                : ["🍀 Acumulou"]

        };


        localStorage.setItem(
            "resultadoSorteio",
            JSON.stringify(resultado)
        );


        let historico =
            JSON.parse(
                localStorage.getItem(
                    "historicoSorteios"
                )
            ) || [];


        historico.push(
            resultado
        );


        localStorage.setItem(
            "historicoSorteios",
            JSON.stringify(
                historico
            )
        );


        alert(
            "🍀 Sorteio realizado!\n\n" +
            "Números:\n" +
            numeros.join(" - ")
        );


    }catch(error){

        console.error(error);


        alert(
            "❌ Erro ao realizar sorteio:\n\n" +
            error.message
        );

    }

}


// =====================================
// APAGAR HISTÓRICO
// =====================================

function apagarHistorico(){

    if(
        confirm(
            "Apagar histórico deste aparelho?"
        )
    ){

        localStorage.removeItem(
            "historicoSorteios"
        );


        alert(
            "Histórico apagado 🍀"
        );

    }

}


// =====================================
// INICIAR
// =====================================

carregarConfiguracoes();

carregarApostas();

</script>

</body>

</html>
