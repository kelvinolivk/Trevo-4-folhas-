<script>

// =====================================
// SENHA
// =====================================

let senhaSalva =
localStorage.getItem("senhaAdmin") || "trevo123";

let senha =
prompt("Digite a senha do administrador:");

if(senha !== senhaSalva){

    alert("Senha incorreta!");

    location.href="../index.html";

}


// =====================================
// CONVERTER VALOR
// =====================================

function numeroValor(valor){

    if(!valor){
        return 0;
    }

    let texto =
        String(valor)
        .replace("R$","")
        .replace(/\s/g,"")
        .replace(/\./g,"")
        .replace(",", ".");

    return Number(texto) || 0;

}


// =====================================
// CARREGAR CONFIGURAÇÃO
// =====================================

async function carregarConfiguracoes(){

    try{

        const { data, error } =
            await supabaseClient
            .from("configuracao")
            .select("*")
            .limit(1);

        if(error){
            throw error;
        }

        let config =
            data && data.length > 0
            ? data[0]
            : null;


        if(!config){

            console.log(
                "Nenhuma configuração encontrada."
            );

            return;

        }


        // ==============================
        // LOTERIA
        // ==============================

        document.getElementById("premio").value =
            config.premio || "";

        document.getElementById("valorAposta").value =
            config.valor_aposta || "";

        document.getElementById("pixLoteria").value =
            config.pix || "";

        document.getElementById("data").value =
            config.data_sorteio || "";

        document.getElementById("hora").value =
            config.hora_sorteio || "";

        document.getElementById("mensagem").value =
            config.mensagem || "";


        // ==============================
        // RIFA
        // ==============================

        document.getElementById("valorRifa").value =
            config.valor_rifa || "";

        document.getElementById("premioRifa").value =
            config.premio_rifa || "";

        document.getElementById("pixRifa").value =
            config.pix_rifa || "";


        // ==============================
        // SALVAR CÓPIA LOCAL
        // ==============================

        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:
                    config.premio || "",

                valorAposta:
                    config.valor_aposta || "",

                pix:
                    config.pix || "",

                data:
                    config.data_sorteio || "",

                hora:
                    config.hora_sorteio || "",

                mensagem:
                    config.mensagem || ""

            })
        );


        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify({

                valor:
                    config.valor_rifa || "",

                premio:
                    config.premio_rifa || "",

                pix:
                    config.pix_rifa || ""

            })
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao carregar configurações:\n\n" +
            error.message
        );

    }

}


// =====================================
// PEGAR ID DA CONFIGURAÇÃO
// =====================================

async function pegarConfiguracao(){

    const { data, error } =
        await supabaseClient
        .from("configuracao")
        .select("*")
        .limit(1);

    if(error){
        throw error;
    }

    if(data && data.length > 0){

        return data[0];

    }

    return null;

}


// =====================================
// SALVAR CONFIGURAÇÕES DA LOTERIA
// =====================================

async function salvarConfiguracoes(){

    let premio =
        document.getElementById("premio").value;

    let valorAposta =
        document.getElementById("valorAposta").value;

    let pix =
        document.getElementById("pixLoteria").value;

    let data =
        document.getElementById("data").value;

    let hora =
        document.getElementById("hora").value;

    let mensagem =
        document.getElementById("mensagem").value;


    try{

        let config =
            await pegarConfiguracao();


        let dados = {

            premio:premio,

            valor_aposta:valorAposta,

            pix:pix,

            data_sorteio:data,

            hora_sorteio:hora,

            mensagem:mensagem

        };


        let resultado;


        if(config){

            resultado =
                await supabaseClient
                .from("configuracao")
                .update(dados)
                .eq("id",config.id);

        }else{

            resultado =
                await supabaseClient
                .from("configuracao")
                .insert([dados]);

        }


        if(resultado.error){

            throw resultado.error;

        }


        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:premio,

                valorAposta:valorAposta,

                pix:pix,

                data:data,

                hora:hora,

                mensagem:mensagem

            })
        );


        alert(
            "🍀 Configurações da Loteria salvas!"
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao salvar Loteria:\n\n" +
            error.message
        );

    }

}


// =====================================
// SALVAR RIFA
// =====================================

async function salvarRifa(){

    let valor =
        document.getElementById("valorRifa").value;

    let premio =
        document.getElementById("premioRifa").value;

    let pix =
        document.getElementById("pixRifa").value;


    try{

        let config =
            await pegarConfiguracao();


        let dados = {

            valor_rifa:valor,

            premio_rifa:premio,

            pix_rifa:pix

        };


        let resultado;


        if(config){

            resultado =
                await supabaseClient
                .from("configuracao")
                .update(dados)
                .eq("id",config.id);

        }else{

            resultado =
                await supabaseClient
                .from("configuracao")
                .insert([dados]);

        }


        if(resultado.error){

            throw resultado.error;

        }


        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify({

                valor:valor,

                premio:premio,

                pix:pix

            })
        );


        alert(
            "🎟️ Configuração da Rifa salva no servidor! 🍀"
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao salvar Rifa:\n\n" +
            error.message
        );

    }

}


// =====================================
// ALTERAR SENHA
// =====================================

function alterarSenha(){

    let novaSenha =
        prompt("Digite a nova senha:");

    if(!novaSenha){
        return;
    }

    localStorage.setItem(
        "senhaAdmin",
        novaSenha
    );

    alert(
        "🔐 Senha alterada com sucesso!"
    );

}


// =====================================
// CARREGAR APOSTAS
// =====================================

async function carregarApostas(){

    let lista =
        document.getElementById("lista");

    try{

        const { data, error } =
            await supabaseClient
            .from("participantes")
            .select("*")
            .order("id",{ascending:false});


        if(error){
            throw error;
        }


        if(!data || data.length === 0){

            lista.innerHTML =
                "Nenhuma aposta registrada 🍀";

            document.getElementById(
                "financeiro"
            ).innerHTML =
                "Nenhuma aposta registrada.";

            return;

        }


        let html = "";

        let pagos = 0;


        data.forEach(function(p){

            if(
                p.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }


            html += `

            <div class="aposta">

            👤 <b>
            ${p.nome || "Não informado"}
            </b>

            <br><br>

            📱 WhatsApp:
            <br>
            ${p.whatsapp || "Não informado"}

            <br><br>

            💳 Pix:
            <br>
            ${p.pix || "Não informado"}

            <br><br>

            📍 Cidade:
            <br>
            ${p.cidade || "Não informado"}

            <br><br>

            🍀 Números:
            <br>
            ${p.numeros || "Não informado"}

            <br><br>

            💰 Status:
            <br>

            <span class="status">
            ${p.pagamento ||
            "🟡 Aguardando pagamento"}
            </span>

            <br><br>

            <button
            onclick="confirmarPagamento(${p.id})">

            ✅ Confirmar pagamento

            </button>

            </div>

            `;

        });


        lista.innerHTML = html;


        let valorAposta =
            numeroValor(
                document.getElementById(
                    "valorAposta"
                ).value
            );


        let arrecadado =
            pagos * valorAposta;


        let premio =
            numeroValor(
                document.getElementById(
                    "premio"
                ).value
            );


        let saldo =
            arrecadado - premio;


        document.getElementById(
            "financeiro"
        ).innerHTML =

        "🎟️ Total de apostas: " +
        data.length +

        "<br><br>" +

        "🟢 Pagamentos confirmados: " +
        pagos +

        "<br><br>" +

        "💰 Arrecadado: R$ " +
        arrecadado.toFixed(2).replace(".",",") +

        "<br><br>" +

        "🏆 Prêmio: R$ " +
        premio.toFixed(2).replace(".",",") +

        "<br><br>" +

        "📈 Saldo: R$ " +
        saldo.toFixed(2).replace(".",",");


    }catch(error){

        console.error(error);

        lista.innerHTML =
            "❌ Erro ao carregar apostas:<br><br>" +
            error.message;

    }

}


// =====================================
// CONFIRMAR PAGAMENTO LOTERIA
// =====================================

async function confirmarPagamento(id){

    if(
        !confirm(
            "Confirmar o pagamento desta aposta?"
        )
    ){

        return;

    }


    try{

        const { error } =
            await supabaseClient
            .from("participantes")
            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })
            .eq("id",id);


        if(error){
            throw error;
        }


        alert(
            "🟢 Pagamento confirmado!"
        );


        carregarApostas();


    }catch(error){

        alert(
            "❌ Erro:\n\n" +
            error.message
        );

    }

}


// =====================================
// CARREGAR RIFA
// =====================================

async function carregarRifa(){

    let vendas =
        document.getElementById(
            "vendasRifa"
        );


    try{

        const { data, error } =
            await supabaseClient
            .from("rifa_participantes")
            .select("*")
            .order("id",{ascending:false});


        if(error){
            throw error;
        }


        let rifa =
            data || [];


        if(rifa.length === 0){

            vendas.innerHTML =
                "Nenhuma venda de rifa realizada.";

            document.getElementById(
                "financeiroRifa"
            ).innerHTML =
                "Nenhuma venda de rifa.";

            return;

        }


        let config =
            await pegarConfiguracao();


        let valor =
            numeroValor(
                config ? config.valor_rifa : 0
            );


        let premio =
            numeroValor(
                config ? config.premio_rifa : 0
            );


        let pagos = 0;

        let html = "";


        rifa.forEach(function(r){

            if(
                r.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }


            html += `

            <div class="aposta">

            👤 <b>
            ${r.nome || "Não informado"}
            </b>

            <br><br>

            📱
            ${r.whatsapp || "Não informado"}

            <br><br>

            🎟️ Número:
            <br>

            <b>
            ${String(r.numero).padStart(2,"0")}
            </b>

            <br><br>

            💰 Status:
            <br>

            ${r.pagamento ||
            "🟡 Aguardando pagamento"}

            <br><br>

            <button
            onclick="confirmarPagamentoRifa(${r.id})">

            ✅ Confirmar pagamento

            </button>

            </div>

            `;

        });


        vendas.innerHTML =
            html;


        let arrecadado =
            pagos * valor;


        let lucro =
            arrecadado - premio;


        document.getElementById(
            "financeiroRifa"
        ).innerHTML =

        "💰 Valor por número: R$ " +
        valor.toFixed(2).replace(".",",") +

        "<br><br>" +

        "🎟️ Vendidos: " +
        rifa.length +
        " / 100" +

        "<br><br>" +

        "🟢 Pagos: " +
        pagos +

        "<br><br>" +

        "💵 Arrecadado: R$ " +
        arrecadado.toFixed(2).replace(".",",") +

        "<br><br>" +

        "🏆 Prêmio: R$ " +
        premio.toFixed(2).replace(".",",") +

        "<br><br>" +

        "📈 Lucro: R$ " +
        lucro.toFixed(2).replace(".",",");


    }catch(error){

        console.error(error);

        vendas.innerHTML =
            "❌ Erro ao carregar Rifa:<br><br>" +
            error.message;

    }

}


// =====================================
// CONFIRMAR PAGAMENTO RIFA
// =====================================

async function confirmarPagamentoRifa(id){

    if(
        !confirm(
            "Confirmar pagamento desta Rifa?"
        )
    ){

        return;

    }


    try{

        const { error } =
            await supabaseClient
            .from("rifa_participantes")
            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })
            .eq("id",id);


        if(error){
            throw error;
        }


        alert(
            "🟢 Pagamento da Rifa confirmado!"
        );


        carregarRifa();


    }catch(error){

        alert(
            "❌ Erro ao confirmar pagamento:\n\n" +
            error.message
        );

    }

}


// =====================================
// SORTEIO LOTERIA
// =====================================

async function realizarSorteio(){

    let numeros = [];


    while(numeros.length < 4){

        let n =
            Math.floor(
                Math.random() * 15
            ) + 1;


        if(!numeros.includes(n)){
            numeros.push(n);
        }

    }


    numeros.sort(
        (a,b)=>a-b
    );


    try{

        const { data, error } =
            await supabaseClient
            .from("participantes")
            .select("*");


        if(error){
            throw error;
        }


        let vencedores = [];


        data.forEach(function(p){

            if(
                p.pagamento !==
                "🟢 Pagamento confirmado"
            ){

                return;

            }


            let aposta;


            try{

                aposta =
                    JSON.parse(p.numeros);

            }catch(e){

                return;

            }


            if(
                Array.isArray(aposta) &&
                aposta.every(
                    n => numeros.includes(Number(n))
                )
            ){

                vencedores.push(p.nome);

            }

        });


        let configuracao =
            JSON.parse(
                localStorage.getItem(
                    "configuracao"
                )
            ) || {};


        let resultado = {

            numeros:numeros,

            data:
                new Date()
                .toLocaleDateString("pt-BR"),

            premio:
                configuracao.premio ||
                "Não informado",

            vencedores:
                vencedores.length > 0
