<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Trevo4Folhas 🍀</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

.caixa{
    background:#222;
    padding:15px;
    border-radius:10px;
    margin:10px auto;
    max-width:400px;
}

button{
    background:#0b8f3a;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px 15px;
    margin-top:10px;
    cursor:pointer;
}
</style>

<script>

let senha = prompt("Digite a senha do administrador:");

if(senha !== "trevo123"){
    alert("Senha incorreta!");
    window.location.href="../index.html";
}

function confirmarPagamento(indice){

    let participantes =
    JSON.parse(localStorage.getItem("participantes")) || [];

    participantes[indice].pagamento = "🟢 Pagamento confirmado";

    localStorage.setItem(
        "participantes",
        JSON.stringify(participantes)
    );

    location.reload();

}

</script>

</head>

<body>

<h1>🔐 Admin Trevo4Folhas 🍀</h1>

<div id="lista"></div>

<script>

let lista = document.getElementById("lista");

let participantes =
JSON.parse(localStorage.getItem("participantes")) || [];

if(participantes.length === 0){

    lista.innerHTML = "<div class='caixa'>Nenhuma aposta registrada 🍀</div>";

}else{

    participantes.forEach(function(p, indice){

        lista.innerHTML += `
        <div class="caixa">

        👤 <b>${p.nome}</b><br><br>

        📱 ${p.whatsapp}<br><br>

        🍀 ${p.numero}<br><br>

        💰 ${p.pagamento}<br><br>

        <button onclick="confirmarPagamento(${indice})">
✅ Confirmar Pagamento
</button>

        </div>
        `;

    });

}

</script>

</body>
</html>
