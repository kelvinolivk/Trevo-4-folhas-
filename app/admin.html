<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin 2.0 - Trevo4Folhas 🍀</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:#071307;

color:white;

text-align:center;

padding:15px;

}


body::before{

content:"🍀 🍀 🍀 🍀 🍀 🍀 🍀";

position:fixed;

top:20px;

left:0;

width:100%;

font-size:50px;

opacity:0.05;

z-index:-1;

}


h1{

color:#6dff7d;

font-size:32px;

text-shadow:0 0 15px #00ff55;

margin:20px;

}


.caixa{

background:#222;

border:1px solid #333;

padding:18px;

border-radius:15px;

margin:15px auto;

max-width:450px;

box-shadow:0 0 15px #000;

}


h3{

color:#6dff7d;

margin-bottom:15px;

}


input{

width:90%;

padding:12px;

margin:5px;

border:none;

}


button{

width:90%;

padding:14px;

margin:8px;

border-radius:12px;

color:white;

font-size:17px;

font-weight:bold;

}

transform:scale(0.97);

}


.verde{

color:#6dff7d;

}

}

</style>


<script>


let senhaSalva = localStorage.getItem("senhaAdmin") || "trevo123";


let senha = prompt("Digite a senha do administrador:");



if(senha !== senhaSalva){

alert("Senha incorreta!");

location.href="../index.html";

}



</script>

</head>


<body>


<h1>
🔐 Admin Trevo4Folhas 2.0 🍀
</h1>



<div class="caixa">

<h3>
🍀 Jogo dos 4 números
</h3>


<input id="premio" placeholder="Valor do prêmio">


<input id="valorAposta" placeholder="Valor da aposta">


<input id="data" placeholder="Data do sorteio">


<input id="hora" placeholder="Hora do sorteio">


<input id="mensagem" placeholder="Mensagem">


<button onclick="salvarConfiguracoes()">

💾 Salvar Configurações

</button>


<button onclick="realizarSorteio()">

🎲 Realizar Sorteio

</button>


</div>



<div class="caixa">

<h3>
🎟️ Rifa 1 a 100
</h3>


<input id="premioRifa" placeholder="Prêmio da rifa">


<input id="valorRifa" placeholder="Valor do número">


<button onclick="salvarRifa()">

💾 Salvar Rifa

</button>


<button onclick="sortearRifa()">

🎯 Sortear Rifa

</button>


</div>
<div class="caixa">

<h3>
💰 Financeiro Geral
</h3>


<div id="financeiro">

Calculando...

</div>


</div>



<div id="listas"></div>



<script>


function salvarConfiguracoes(){


let configuracao={


premio:document.getElementById("premio").value,


valorAposta:document.getElementById("valorAposta").value,


data:document.getElementById("data").value,


hora:document.getElementById("hora").value,


mensagem:document.getElementById("mensagem").value


};



localStorage.setItem(

"configuracao",

JSON.stringify(configuracao)

);



alert("Configurações salvas 🍀");


}





function salvarRifa(){


let rifa={


premioRifa:
document.getElementById("premioRifa").value,


valorRifa:
document.getElementById("valorRifa").value


};



localStorage.setItem(

"configuracaoRifa",

JSON.stringify(rifa)

);



alert("Configuração da rifa salva 🎟️");


}





function gerarNumeros(){


let numeros=[];



while(numeros.length < 4){


let n=Math.floor(Math.random()*15)+1;



if(!numeros.includes(n)){


numeros.push(n);


}


}



return numeros.sort((a,b)=>a-b);


}





function realizarSorteio(){


let numeros=gerarNumeros();



let participantes=

JSON.parse(localStorage.getItem("participantes")) || [];



let vencedores=[];



participantes.forEach(function(p){



let aposta=p.numero;



if(typeof aposta==="string"){


aposta=JSON.parse(aposta);


}



if(p.pagamento==="🟢 Pagamento confirmado"){



let ganhou=aposta.every(function(n){


return numeros.includes(n);


});



if(ganhou){


vencedores.push(p.nome);


}



}



});





let configuracao=

JSON.parse(localStorage.getItem("configuracao")) || {};





let resultado={


numeros:numeros,


data:new Date().toLocaleDateString("pt-BR"),


premio:configuracao.premio || "Não informado",


vencedores:

vencedores.length>0

?

vencedores

:

["🍀 Acumulou"]


};





localStorage.setItem(

"resultadoSorteio",

JSON.stringify(resultado)

);





let historico=

JSON.parse(localStorage.getItem("historicoSorteios")) || [];



historico.push(resultado);



localStorage.setItem(

"historicoSorteios",

JSON.stringify(historico)

);



alert(

"🎲 Sorteio realizado!\n\n"+

numeros.join(" - ")

);


}





function sortearRifa(){


let participantes=

JSON.parse(localStorage.getItem("rifaParticipantes")) || [];



if(participantes.length===0){


alert("Nenhuma rifa registrada.");

return;


}



let pagos=participantes.filter(function(p){


return p.pagamento==="🟢 Pagamento confirmado";


});



if(pagos.length===0){


alert("Nenhum pagamento confirmado.");

return;


}



let vencedor=

pagos[Math.floor(Math.random()*pagos.length)];



let resultadoRifa={


numero:vencedor.numero,


nome:vencedor.nome,


data:new Date().toLocaleDateString("pt-BR")


};



localStorage.setItem(

"resultadoRifa",

JSON.stringify(resultadoRifa)

);



alert(

"🎉 Vencedor da rifa:\n\n"+

vencedor.nome+

"\nNúmero: "+

vencedor.numero

);


}
