/* =====================================
CARREGAR CONFIGURAÇÃO
===================================== */

async function carregarConfiguracoes(){

    try{

        const { data, error } =
            await supabaseClient
            .from("configuracao")
            .select("*")
            .limit(1);

        if(error){

            console.error(error);

            throw error;

        }

        if(!data || data.length === 0){

            console.log(
                "Nenhuma configuração encontrada."
            );

            document.getElementById("financeiro").innerHTML =
                "⚠️ Configuração ainda não cadastrada.";

            return;

        }

        const config = data[0];

        console.log(
            "CONFIGURAÇÃO CARREGADA:",
            config
        );


        /* =====================================
        LOTERIA
        ===================================== */

        document.getElementById("premio").value =
            config.premio || "";

        document.getElementById("valorAposta").value =
            config.valor_aposta || "";

        document.getElementById("data").value =
            config.data_sorteio || "";

        document.getElementById("hora").value =
            config.hora_sorteio || "";

        document.getElementById("mensagem").value =
            config.mensagem || "";


        /*
        Mantém a configuração local
        como apoio.
        */

        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:
                    config.premio || "",

                valorAposta:
                    config.valor_aposta || "",

                pix:
                    config.pix || "",

                data:
                    config.data_sorteio || "",

                hora:
                    config.hora_sorteio || "",

                mensagem:
                    config.mensagem || ""

            })
        );


        /*
        Se existir coluna pix,
        mostra no campo.
        */

        if(
            document.getElementById("pixLoteria")
        ){

            document.getElementById("pixLoteria").value =
                config.pix || "";

        }


        /* =====================================
        RIFA
        ===================================== */

        document.getElementById("valorRifa").value =
            config.valor_rifa || "";

        document.getElementById("premioRifa").value =
            config.premio_rifa || "";

        document.getElementById("pixRifa").value =
            config.pix_rifa || "";


        /*
        Guarda também localmente
        */

        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify({

                valor:
                    config.valor_rifa || "",

                premio:
                    config.premio_rifa || "",

                pix:
                    config.pix_rifa || ""

            })
        );


    }catch(error){

        console.error(
            "Erro ao carregar configuração:",
            error
        );

        alert(
            "❌ Erro ao carregar configuração:\n\n" +
            error.message
        );

    }

}


/* =====================================
SALVAR LOTERIA
===================================== */

async function salvarConfiguracoes(){

    let premio =
        document.getElementById("premio").value;

    let valorAposta =
        document.getElementById("valorAposta").value;

    let pix =
        document.getElementById("pixLoteria").value;

    let data =
        document.getElementById("data").value;

    let hora =
        document.getElementById("hora").value;

    let mensagem =
        document.getElementById("mensagem").value;


    try{

        const { data:configAtual, error:erroBusca } =
            await supabaseClient
            .from("configuracao")
            .select("id")
            .limit(1);

        if(erroBusca){

            throw erroBusca;

        }


        if(!configAtual || configAtual.length === 0){

            throw new Error(
                "A configuração principal ainda não existe no banco."
            );

        }


        const id =
            configAtual[0].id;


        const { error } =
            await supabaseClient
            .from("configuracao")
            .update({

                premio:
                    premio,

                valor_aposta:
                    valorAposta,

                pix:
                    pix,

                data_sorteio:
                    data,

                hora_sorteio:
                    hora,

                mensagem:
                    mensagem

            })
            .eq("id",id);


        if(error){

            throw error;

        }


        localStorage.setItem(
            "configuracao",
            JSON.stringify({

                premio:
                    premio,

                valorAposta:
                    valorAposta,

                pix:
                    pix,

                data:
                    data,

                hora:
                    hora,

                mensagem:
                    mensagem

            })
        );


        alert(
            "🍀 Configurações da Loteria salvas!"
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao salvar Loteria:\n\n" +
            error.message
        );

    }

}


/* =====================================
SALVAR RIFA
===================================== */

    let valor =
        document.getElementById("valorRifa").value;

    let premio =
        document.getElementById("premioRifa").value;

    let pix =
        document.getElementById("pixRifa").value;


    try{

        const { data:configAtual, error:erroBusca } =
            await supabaseClient
            .from("configuracao")
            .select("id")
            .limit(1);


        if(erroBusca){

            throw erroBusca;

        }


        if(!configAtual || configAtual.length === 0){

            throw new Error(
                "A configuração principal ainda não existe no banco."
            );

        }


        const id =
            configAtual[0].id;


        const { error } =
            await supabaseClient
            .from("configuracao")
            .update({

                valor_rifa:
                    valor,

                premio_rifa:
                    premio,

                pix_rifa:
                    pix

            })
            .eq("id",id);


        if(error){

            throw error;

        }


        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify({

                valor:
                    valor,

                premio:
                    premio,

                pix:
                    pix

            })
        );


        alert(
            "🎟️ Configuração da Rifa salva com sucesso! 🍀"
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao salvar Rifa:\n\n" +
            error.message
        );

    }

}


/* =====================================
ALTERAR SENHA
===================================== */

function alterarSenha(){

    let novaSenha =
        prompt("Digite a nova senha:");

    if(!novaSenha){

        return;

    }


    localStorage.setItem(
        "senhaAdmin",
        novaSenha
    );


    alert(
        "🔐 Senha alterada com sucesso!"
    );

}


/* =====================================
CARREGAR APOSTAS
===================================== */

async function carregarApostas(){

    let lista =
        document.getElementById("lista");


    try{

        const { data, error } =
            await supabaseClient
            .from("participantes")
            .select("*")
            .order("id",{ascending:false});


        if(error){

            throw error;

        }


        if(!data || data.length === 0){

            lista.innerHTML =
                "Nenhuma aposta registrada 🍀";

            document.getElementById(
                "financeiro"
            ).innerHTML =
                "Nenhuma aposta registrada.";

            return;

        }


        let html = "";

        let pagos = 0;


        data.forEach(function(p){

            if(
                p.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }


            html += `

            <div class="aposta">

            👤 <b>
            ${p.nome || "Não informado"}
            </b>

            <br><br>

            📱 WhatsApp:
            <br>
            ${p.whatsapp || "Não informado"}

            <br><br>

            💳 Pix:
            <br>
            ${p.pix || "Não informado"}

            <br><br>

            📍 Cidade:
            <br>
            ${p.cidade || "Não informado"}

            <br><br>

            🍀 Números:
            <br>
            ${p.numeros || "Não informado"}

            <br><br>

            💰 Status:
            <br>

            <span class="status">
            ${p.pagamento ||
            "🟡 Aguardando pagamento"}
            </span>

            <br><br>

            <button
            onclick="confirmarPagamento(${p.id})">

            ✅ Confirmar pagamento

            </button>

            </div>

            `;

        });


        lista.innerHTML =
            html;


        let valorAposta =
            Number(
                String(
                    document.getElementById(
                        "valorAposta"
                    ).value
                ).replace(",",".")
            ) || 0;


        let arrecadado =
            pagos * valorAposta;


        let premio =
            Number(
                String(
                    document.getElementById(
                        "premio"
                    ).value
                ).replace(",",".")
            ) || 0;


        let saldo =
            arrecadado - premio;


        document.getElementById(
            "financeiro"
        ).innerHTML =

        "🎟️ Total de apostas: " +
        data.length +

        "<br><br>" +

        "🟢 Pagamentos confirmados: " +
        pagos +

        "<br><br>" +

        "💰 Arrecadado: R$ " +
        arrecadado.toFixed(2) +

        "<br><br>" +

        "🏆 Prêmio: R$ " +
        premio.toFixed(2) +

        "<br><br>" +

        "📈 Saldo: R$ " +
        saldo.toFixed(2);


    }catch(error){

        console.error(error);

        lista.innerHTML =
            "❌ Erro ao carregar apostas:<br><br>" +
            error.message;

    }

}


/* =====================================
CONFIRMAR PAGAMENTO
===================================== */

async function confirmarPagamento(id){

    if(
        !confirm(
            "Confirmar o pagamento desta aposta?"
        )
    ){

        return;

    }


    try{

        const { error } =
            await supabaseClient
            .from("participantes")
            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })
            .eq("id",id);


        if(error){

            throw error;

        }


        alert(
            "🟢 Pagamento confirmado!"
        );


        carregarApostas();


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao confirmar pagamento:\n\n" +
            error.message
        );

    }

}


/* =====================================
CARREGAR RIFA
===================================== */

async function carregarRifa(){

    let vendas =
        document.getElementById(
            "vendasRifa"
        );


    try{

        const { data, error } =
            await supabaseClient
            .from("rifa_participantes")
            .select("*")
            .order("id",{ascending:false});


        if(error){

            throw error;

        }


        let rifa =
            data || [];


        if(rifa.length === 0){

            vendas.innerHTML =
                "Nenhuma venda de rifa realizada.";

        }else{

            let html = "";

            rifa.forEach(function(r){

                html += `

                <div class="aposta">

                👤 <b>
                ${r.nome || "Não informado"}
                </b>

                <br><br>

                📱
                ${r.whatsapp || "Não informado"}

                <br><br>

                🎟️ Número:

                <br>

                <b>
                ${String(r.numero).padStart(2,"0")}
                </b>

                <br><br>

                💰 Status:

                <br>

                <span class="status">
                ${r.pagamento ||
                "🟡 Aguardando pagamento"}
                </span>

                <br><br>

                <button
                onclick="confirmarPagamentoRifa(${r.id})">

                ✅ Confirmar pagamento

                </button>

                </div>

                `;

            });


            vendas.innerHTML =
                html;

        }


        /* =====================================
        USA A CONFIGURAÇÃO REAL DO SUPABASE
        ===================================== */

        const { data:configData, error:configError } =
            await supabaseClient
            .from("configuracao")
            .select(
                "valor_rifa,premio_rifa,pix_rifa"
            )
            .limit(1);


        if(configError){

            throw configError;

        }


        let config =
            configData &&
            configData.length > 0
            ? configData[0]
            : {};


        let valor =
            Number(
                String(
                    config.valor_rifa || "0"
                ).replace(",",".")
            ) || 0;


        let premio =
            Number(
                String(
                    config.premio_rifa || "0"
                ).replace(",",".")
            ) || 0;


        let pagos = 0;


        rifa.forEach(function(r){

            if(
                r.pagamento ===
                "🟢 Pagamento confirmado"
            ){

                pagos++;

            }

        });


        let arrecadado =
            pagos * valor;


        let lucro =
            arrecadado - premio;


        document.getElementById(
            "financeiroRifa"
        ).innerHTML =

        "💰 Valor por número: R$ " +
        valor.toFixed(2) +

        "<br><br>" +

        "🎟️ Vendidos: " +
        rifa.length +
        " / 100" +

        "<br><br>" +

        "🟢 Pagos: " +
        pagos +

        "<br><br>" +

        "💵 Arrecadado: R$ " +
        arrecadado.toFixed(2) +

        "<br><br>" +

        "🏆 Prêmio: " +
        (config.premio_rifa || "Não informado") +

        "<br><br>" +

        "📈 Saldo: R$ " +
        lucro.toFixed(2);


    }catch(error){

        console.error(error);

        vendas.innerHTML =
            "❌ Erro ao carregar Rifa:<br><br>" +
            error.message;

    }

}


/* =====================================
CONFIRMAR PAGAMENTO RIFA
===================================== */

async function confirmarPagamentoRifa(id){

    if(
        !confirm(
            "Confirmar pagamento desta Rifa?"
        )
    ){

        return;

    }


    try{

        const { error } =
            await supabaseClient
            .from("rifa_participantes")
            .update({

                pagamento:
                    "🟢 Pagamento confirmado"

            })
            .eq("id",id);


        if(error){

            throw error;

        }


        alert(
            "🟢 Pagamento da Rifa confirmado!"
        );


        carregarRifa();


    }catch(error){

        console.error(error);

        alert(
            "❌ Erro ao confirmar pagamento:\n\n" +
            error.message
        );

    }

}


/* =====================================
SORTEIO LOTERIA
===================================== */

async function realizarSorteio(){
