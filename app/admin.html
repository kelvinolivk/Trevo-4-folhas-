<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin 2.0 - Trevo4Folhas 🍀</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:#071307;

color:white;

text-align:center;

padding:15px;

}


body::before{

content:"🍀 🍀 🍀 🍀 🍀 🍀 🍀";

position:fixed;

top:20px;

left:0;

width:100%;

font-size:50px;

opacity:0.05;

z-index:-1;

}


h1{

color:#6dff7d;

font-size:32px;

text-shadow:0 0 15px #00ff55;

margin:20px;

}


.caixa{

background:#222;

border:1px solid #333;

padding:18px;

border-radius:15px;

margin:15px auto;

max-width:450px;

box-shadow:0 0 15px #000;

}


h3{

color:#6dff7d;

margin-bottom:15px;

}


input{

width:90%;

padding:12px;

margin:5px;

border:none;

border-radius:10px;

font-size:16px;

}


button{

width:90%;

max-width:350px;

padding:14px;

margin:8px;

border:none;

border-radius:12px;

background:#0b8f3a;

color:white;

font-size:17px;

font-weight:bold;

}


button:active{

transform:scale(0.97);

}


.verde{

color:#6dff7d;

}


.amarelo{

color:#ffd700;

}


.vermelho{

color:#ff5555;

}


</style>


<script>


let senhaSalva = localStorage.getItem("senhaAdmin") || "trevo123";


let senha = prompt("Digite a senha do administrador:");



if(senha !== senhaSalva){

alert("Senha incorreta!");

location.href="../index.html";

}



</script>

</head>


<body>


<h1>
🔐 Admin Trevo4Folhas 2.0 🍀
</h1>



<div class="caixa">

<h3>
🍀 Jogo dos 4 números
</h3>


<input id="premio" placeholder="Valor do prêmio">


<input id="valorAposta" placeholder="Valor da aposta">


<input id="data" placeholder="Data do sorteio">


<input id="hora" placeholder="Hora do sorteio">


<input id="mensagem" placeholder="Mensagem">


<button onclick="salvarConfiguracoes()">

💾 Salvar Configurações

</button>


<button onclick="realizarSorteio()">

🎲 Realizar Sorteio

</button>


</div>



<div class="caixa">

<h3>
🎟️ Rifa 1 a 100
</h3>


<input id="premioRifa" placeholder="Prêmio da rifa">


<input id="valorRifa" placeholder="Valor do número">


<button onclick="salvarRifa()">

💾 Salvar Rifa

</button>


<button onclick="sortearRifa()">

🎯 Sortear Rifa

</button>


</div>
