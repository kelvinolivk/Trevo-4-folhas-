```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro Trevo4Folhas 🍀</title>

<style>

body{
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

.caixa{
    background:#222;
    padding:20px;
    border-radius:15px;
    max-width:400px;
    margin:auto;
}

input{
    width:90%;
    padding:12px;
    margin:8px;
    border-radius:10px;
    border:none;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:90%;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:#0b8f3a;
    color:white;
    font-size:18px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>🍀 Trevo4Folhas</h1>

<div class="caixa">

<h2>Cadastro do participante</h2>

<input id="nome" type="text" placeholder="Nome completo">

<input id="whatsapp" type="tel" placeholder="WhatsApp">

<input id="pix" type="text" placeholder="Sua chave Pix">

<input id="cidade" type="text" placeholder="Cidade">

<button onclick="salvarCadastro()">
✅ Salvar cadastro
</button>

<button onclick="verCadastro()">
📋 Ver cadastro salvo
</button>

<button onclick="location.href='../index.html'">
🏠 Voltar ao início
</button>

</div>

<div class="caixa" id="resultado"></div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

async function salvarCadastro(){

    alert("🍀 TESTE DO BOTÃO");

    const nome =
        document.getElementById("nome").value.trim();

    alert("🍀 PEGOU O NOME: " + nome);

    const whatsapp =
        document.getElementById("whatsapp").value.trim();

    alert("🍀 PEGOU O WHATSAPP: " + whatsapp);

    const pix =
        document.getElementById("pix").value.trim();

    const cidade =
        document.getElementById("cidade").value.trim();

    alert("🍀 PEGOU TODOS OS CAMPOS");


    if(nome === "" || whatsapp === ""){

        alert("Preencha nome e WhatsApp 🍀");

        return;

    }

}


    const cadastro = {

        nome: nome,
        whatsapp: whatsapp,
        pix: pix,
        cidade: cidade,
        numeros: "",
        pagamento: "Pendente",
        data: ""

    };


    const { data, error } = await supabase

        .from("participantes")

        .insert([cadastro])

        .select();


    if(error){

        console.error("Erro Supabase:", error);

        alert(
            "❌ Erro ao salvar:\n" +
            error.message
        );

        return;

    }


    localStorage.setItem(
        "cadastro",
        JSON.stringify(cadastro)
    );


    alert("🍀 Cadastro salvo com sucesso!");

}


function verCadastro(){

    const cadastro =
        JSON.parse(
            localStorage.getItem("cadastro")
        );


    if(!cadastro){

        document.getElementById("resultado").innerHTML =
            "Nenhum cadastro encontrado.";

        return;

    }


    document.getElementById("resultado").innerHTML = `

        <h3>Cadastro salvo</h3>

        👤 ${cadastro.nome}<br><br>

        📱 ${cadastro.whatsapp}<br><br>

        💳 ${cadastro.pix || "Não informado"}<br><br>

        📍 ${cadastro.cidade || "Não informado"}

    `;

}


const salvo =
    JSON.parse(
        localStorage.getItem("cadastro")
    );


if(salvo){

    document.getElementById("nome").value =
        salvo.nome || "";

    document.getElementById("whatsapp").value =
        salvo.whatsapp || "";

    document.getElementById("pix").value =
        salvo.pix || "";

    document.getElementById("cidade").value =
        salvo.cidade || "";

}

</script>

</body>

</html>
```
