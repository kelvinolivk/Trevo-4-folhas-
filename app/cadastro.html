<!DOCTYPE html>
<html>
<head>
<title>Trevo4Folhas 🍀</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
}

input, button {
    width: 90%;
    padding: 12px;
    margin: 8px;
    border-radius: 8px;
}

button {
    background: green;
    color: white;
    border: none;
    font-size: 18px;
}
</style>

</head>

<body>

<h1>🍀 Trevo4Folhas</h1>

<h2>Cadastro do participante</h2>

<input type="text" placeholder="Nome">

<input type="tel" placeholder="WhatsApp">

<button onclick="irParaNumeros()">Escolher número</button>
<script src="participantes.js"></script>

<script>
function irParaNumeros(){
    let nome = document.querySelector("input[type=text]").value;
    let whatsapp = document.querySelector("input[type=tel]").value;

    if(nome == "" || whatsapp == ""){
        alert("Preencha seus dados");
    } else {
        localStorage.setItem("nome", nome);
        localStorage.setItem("whatsapp", whatsapp);
        window.location.href="numeros.html";
    }
}
</script>
</body>
</html>
