<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro - Trevo4Folhas 🍀</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
padding:20px;
}

.caixa{

background:#222;
padding:20px;
border-radius:15px;
max-width:400px;
margin:auto;

}

input{

width:90%;
padding:12px;
margin:8px;
border-radius:10px;
border:none;
font-size:16px;

}

button{

width:90%;
padding:15px;
margin-top:15px;
background:#0b8f3a;
color:white;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;

}

</style>

</head>

<body>


<h1>🍀 Trevo4Folhas</h1>


<div class="caixa">

<h2>Cadastro do participante</h2>


<input id="nome" placeholder="Nome completo">


<input id="whatsapp" placeholder="WhatsApp">


<input id="pix" placeholder="Sua chave Pix">


<input id="cidade" placeholder="Cidade">


<button onclick="salvarCadastro()">

✅ Continuar

</button>


</div>



<script>


function salvarCadastro(){


let cadastro = {

nome:
document.getElementById("nome").value,

whatsapp:
document.getElementById("whatsapp").value,

pix:
document.getElementById("pix").value,

cidade:
document.getElementById("cidade").value

};



if(
cadastro.nome=="" ||
cadastro.whatsapp==""
){

alert("Preencha nome e WhatsApp");

return;

}



localStorage.setItem(

"cadastro",

JSON.stringify(cadastro)

);



localStorage.setItem(
"nome",
cadastro.nome
);


localStorage.setItem(
"whatsapp",
cadastro.whatsapp
);



alert("Cadastro salvo 🍀");



window.location.href="numeros.html";


}


</script>


</body>

</html>
