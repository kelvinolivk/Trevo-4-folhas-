<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minhas Apostas 🍀</title>


<style>

body{

margin:0;

padding:20px;

background:#111;

color:white;

font-family:Arial,sans-serif;

text-align:center;

}


h1{

color:#3ddc84;

}


input{

width:90%;

max-width:350px;

padding:12px;

margin:10px 0;

border-radius:10px;

border:none;

font-size:16px;

}


button{

width:90%;

max-width:350px;

padding:15px;

margin:10px 0;

border:none;

border-radius:10px;

background:#19a34a;

color:white;

font-size:17px;

cursor:pointer;

}


.caixa{

max-width:400px;

margin:20px auto;

background:#222;

padding:20px;

border-radius:15px;

}


</style>


</head>


<body>


<h1>🍀 Minhas Apostas</h1>


<p>

Digite o nome usado no cadastro.

</p>


<input

type="text"

id="nome"

placeholder="Seu nome">


<button onclick="buscar()">

🔍 Buscar minhas apostas

</button>


<div id="resultado"></div>


<button onclick="location.href='../index.html'">

🏠 Voltar ao início

</button>

<script>


function buscar(){


let nome =

document.getElementById("nome").value.trim();



let participantes =

JSON.parse(localStorage.getItem("participantes")) || [];



let html = "";



participantes.forEach(function(p){



if(

p.nome.toLowerCase() == nome.toLowerCase()

){



html += `


<div class="caixa">


<h2>

👤 ${p.nome}

</h2>



<p>

<b>📱 WhatsApp:</b><br>

${p.whatsapp || "Não informado"}

</p>



<p>

<b>💳 Pix:</b><br>

${p.pix || "Não informado"}

</p>



<p>

<b>📍 Cidade:</b><br>

${p.cidade || "Não informado"}

</p>



<p>

<b>🍀 Números:</b><br>

${p.numero}

</p>



<p>

<b>📅 Data da aposta:</b><br>

${p.data || "Não informado"}

</p>



<p>

<b>💰 Status:</b><br>

${p.pagamento}

</p>



</div>


`;



}



});



if(html==""){



html = `


<div class="caixa">

Nenhuma aposta encontrada para esse nome.

</div>


`;



}



document.getElementById("resultado").innerHTML = html;



}

</script>


</body>

</html>
