<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trevo4Folhas 🍀</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#071307;
font-family:Arial;
color:white;
text-align:center;
overflow:hidden;

}

/* Fundo */

#fundo{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;

}

h1{

margin-top:20px;
font-size:34px;
color:#6dff7d;
text-shadow:0 0 15px #00ff55;

}

#contador{

margin-top:10px;
font-size:20px;

}

#lista{

max-width:430px;
margin:auto;
margin-top:25px;

display:grid;
grid-template-columns:repeat(5,1fr);

gap:14px;

padding:10px;

}

.trevo{

height:72px;

background:#114d20;

border:2px solid #00ff66;

border-radius:18px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

font-size:22px;

cursor:pointer;

transition:.25s;

box-shadow:0 0 10px #0f0;

}

.trevo span:last-child{

font-size:20px;
font-weight:bold;

}

.trevo:hover{

transform:scale(1.08);

}

.selecionado{

background:#ffd700;

color:black;

box-shadow:0 0 20px gold;

transform:scale(1.08);

}

button{

margin-top:20px;

padding:15px;

width:90%;

max-width:400px;

border:none;

border-radius:12px;

background:#0b8f3a;

color:white;

font-size:18px;

font-weight:bold;

}

</style>

</head>

<body>

<canvas id="fundo"></canvas>

<h1>🍀 Escolha 4 números</h1>

<h2 id="contador">
Selecionados: 0/4
</h2>

<div id="lista"></div>

<script>

let escolhidos = [];

const lista = document.getElementById("lista");

for(let i = 1; i <= 15; i++){

    let trevo = document.createElement("div");

    trevo.className = "trevo";

    trevo.innerHTML = `
        <span>🍀</span>
        <span>${i}</span>
    `;

    trevo.onclick = function(){

        if(escolhidos.includes(i)){

            escolhidos = escolhidos.filter(n => n != i);

            trevo.classList.remove("selecionado");

        }else{

            if(escolhidos.length >= 4){

                alert("Você pode escolher apenas 4 números 🍀");

                return;

            }

            escolhidos.push(i);

            trevo.classList.add("selecionado");

        }

        document.getElementById("contador").innerHTML =
        "Selecionados: " + escolhidos.length + "/4";

    };

    lista.appendChild(trevo);

}

function confirmar(){

    if(escolhidos.length != 4){

        alert("Escolha exatamente 4 números 🍀");

        return;

    }

    let nome = localStorage.getItem("nome");

    let whatsapp = localStorage.getItem("whatsapp");

    let participantes =
    JSON.parse(localStorage.getItem("participantes")) || [];

    participantes.push({

        nome:nome,

        whatsapp:whatsapp,

        numero:JSON.stringify(escolhidos),

        pagamento:"🟡 Aguardando pagamento"

    });

    localStorage.setItem(
        "participantes",
        JSON.stringify(participantes)
    );

    localStorage.setItem(
        "numeroEscolhido",
        JSON.stringify(escolhidos)
    );

    location.href="pix.html";

}
function limpar(){

    escolhidos = [];

    document.querySelectorAll(".trevo").forEach(function(t){

        t.classList.remove("selecionado");

    });

    document.getElementById("contador").innerHTML =
    "Selecionados: 0/4";

}



/* ---------- Fundo animado ---------- */

const canvas = document.getElementById("fundo");

const ctx = canvas.getContext("2d");

function redimensionar(){

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

}

redimensionar();

window.onresize = redimensionar;



let trevos = [];

for(let i=0;i<90;i++){

    trevos.push({

        x:Math.random()*canvas.width,

        y:Math.random()*canvas.height,

        tamanho:10+Math.random()*18,

        alpha:Math.random(),

        velocidade:0.01+Math.random()*0.03

    });

}



function animar(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    trevos.forEach(function(t){

        t.alpha += t.velocidade;

        ctx.globalAlpha = 0.20 + 0.30 * Math.sin(t.alpha);

        ctx.font = t.tamanho + "px Arial";

        ctx.fillText("🍀",t.x,t.y);

    });

    requestAnimationFrame(animar);

}

animar();

</script>

<br>

<button onclick="confirmar()">
✅ Confirmar aposta
</button>

<br>

<button onclick="limpar()">
🧹 Limpar seleção
</button>

</body>
</html>
