<!DOCTYPE html>
<html>
<head>
<title>Trevo4Folhas 🍀</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

.numero {
  display: inline-block;
  background: green;
  padding: 15px;
  margin: 5px;
  border-radius: 50%;
  width: 20px;
}

button {
  padding: 15px;
  margin-top: 20px;
  background: #0a0;
  color: white;
  border: none;
  border-radius: 10px;
}
</style>

</head>

<body>

<h1>🍀 Escolha seu número</h1>

<div>
<script>
for(let i=1;i<=15;i++){
 document.write("<span class='numero'>"+i+"</span>");
}
</script>
</div>

<button>Confirmar número</button>

</body>
</html>
