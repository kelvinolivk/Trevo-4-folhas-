<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pagamento Rifa Trevo4Folhas 🍀</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

.caixa{
    background:#222;
    padding:20px;
    border-radius:15px;
    max-width:400px;
    margin:auto;
}

h1{
    color:#3ddc84;
}

.numero{
    font-size:45px;
    color:#ffd700;
    font-weight:bold;
    margin:20px;
}

.info{
    margin:18px 0;
    font-size:18px;
}

.valor{
    color:#6dff7d;
    font-size:24px;
    font-weight:bold;
}

.premio{
    color:#ffd700;
    font-size:22px;
    font-weight:bold;
}

.pix{
    background:#111;
    padding:12px;
    border-radius:10px;
    word-break:break-all;
    margin-top:8px;
}

button{
    width:90%;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:#0b8f3a;
    color:white;
    font-size:18px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="caixa">

<h1>🎟️ Rifa Trevo4Folhas 🍀</h1>

<div id="dados">
⏳ Carregando dados da Rifa...
</div>

<button onclick="copiarPix()">
📋 Copiar Pix
</button>

<button onclick="confirmarPagamento()">
✅ Já realizei o pagamento
</button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

// =====================================
// RIFA ATUAL
// =====================================

let rifa =
JSON.parse(
    localStorage.getItem("rifaAtual")
) || null;


// =====================================
// CONFIGURAÇÃO
// =====================================

let configuracaoRifa = {};


// =====================================
// VERIFICAR RIFA
// =====================================

if(!rifa){

    alert("Nenhuma rifa encontrada.");

    location.href = "rifa.html";

}


// =====================================
// CARREGAR CONFIGURAÇÃO DA RIFA
// =====================================

async function carregarConfiguracaoRifa(){

    const dados =
        document.getElementById("dados");

    dados.innerHTML =
        "⏳ Carregando dados da Rifa...";

    try{

        const { data, error } =

            await supabaseClient

            .from("configuracoes")

            .select("valor,premio,pix")

            .eq("tipo","rifa")

            .order("id",{ascending:false})

            .limit(1);


        if(error){

            console.error(
                "Erro Supabase:",
                error
            );

            throw error;

        }


        if(!data || data.length === 0){

            dados.innerHTML =

                "⚠️ A configuração da Rifa ainda não foi encontrada.";

            return;

        }


        // =====================================
        // PEGA A CONFIGURAÇÃO DA RIFA
        // =====================================

        configuracaoRifa =
            data[0];


        // =====================================
        // SALVA NO CELULAR
        // =====================================

        localStorage.setItem(

            "configuracaoRifa",

            JSON.stringify({

                valor:
                    configuracaoRifa.valor || "",

                premio:
                    configuracaoRifa.premio || "",

                pix:
                    configuracaoRifa.pix || ""

            })

        );


        mostrarDados();


    }catch(error){

        console.error(
            "Erro ao carregar Rifa:",
            error
        );


        dados.innerHTML =

            "❌ Não foi possível carregar os dados da Rifa." +

            "<br><br>" +

            error.message;

    }

}


// =====================================
// MOSTRAR DADOS
// =====================================

function mostrarDados(){

    let valor =
        configuracaoRifa.valor || "A definir";

    let premio =
        configuracaoRifa.premio || "A definir";

    let pix =
        configuracaoRifa.pix || "Pix não informado";


    document.getElementById("dados").innerHTML = `

        <div class="info">

            👤 Participante:

            <br>

            <b>
                ${rifa.nome || "Não informado"}
            </b>

        </div>


        <div class="info">

            🎟️ Número escolhido:

        </div>


        <div class="numero">

            ${String(rifa.numero).padStart(2,"0")}

        </div>


        <div class="info">

            💰 Valor da Rifa:

            <br>

            <span class="valor">
                R$ ${valor}
            </span>

        </div>


        <div class="info">

            🏆 Prêmio:

            <br>

            <span class="premio">
                ${premio}
            </span>

        </div>


        <div class="info">

            💳 Pix para pagamento:

            <div
                id="pix"
                class="pix"
            >

                ${pix}

            </div>

        </div>

    `;

}


// =====================================
// COPIAR PIX
// =====================================

function copiarPix(){

    let elemento =
        document.getElementById("pix");


    if(!elemento){

        alert(
            "⚠️ Chave Pix ainda não carregada."
        );

        return;

    }


    let pix =
        elemento.innerText.trim();


    if(
        !pix ||
        pix === "Pix não informado"
    ){

        alert(
            "⚠️ O administrador ainda não cadastrou o Pix da Rifa."
        );

        return;

    }


    navigator.clipboard
    .writeText(pix)

    .then(function(){

        alert(
            "🍀 Pix da Rifa copiado!"
        );

    })

    .catch(function(){

        alert(
            "❌ Não foi possível copiar o Pix."
        );

    });

}


// =====================================
// CONFIRMAR PAGAMENTO
// =====================================

async function confirmarPagamento(){

    if(!rifa){

        alert(
            "❌ Rifa não encontrada."
        );

        return;

    }


    // =====================================
    // ATUALIZA LOCALSTORAGE
    // =====================================

    let lista =

        JSON.parse(

            localStorage.getItem(
                "rifaParticipantes"
            )

        ) || [];


    let indice =

        lista.findIndex(function(p){

            return (

                Number(p.numero) ===
                Number(rifa.numero)

                &&

                p.nome ===
                rifa.nome

            );

        });


    if(indice !== -1){

        lista[indice].pagamento =
            "🟡 Aguardando confirmação";

        lista[indice].data =
            new Date()
            .toLocaleString("pt-BR");

    }


    localStorage.setItem(

        "rifaParticipantes",

        JSON.stringify(lista)

    );


    // =====================================
    // ATUALIZA SUPABASE
    // =====================================

    try{

        const { data, error } =

            await supabaseClient

            .from("rifa_participantes")

            .select("id")

            .eq(
                "numero",
                rifa.numero
            )

            .eq(
                "nome",
                rifa.nome
            )

            .limit(1);


        if(error){

            console.error(
                "Erro ao localizar Rifa:",
                error
            );

        }


        if(data && data.length > 0){

            const id =
                data[0].id;


            const { error:updateError } =

                await supabaseClient

                .from("rifa_participantes")

                .update({

                    pagamento:
                        "🟡 Aguardando confirmação"

                })

                .eq(
                    "id",
                    id
                );


            if(updateError){

                console.error(
                    "Erro ao atualizar pagamento:",
                    updateError
                );

            }

        }


    }catch(error){

        console.error(
            "Erro no pagamento:",
            error
        );

    }


    alert(

        "🍀 Pagamento informado!\n\n" +

        "Aguarde a confirmação do administrador."

    );


    location.href =
        "rifa.html";

}


// =====================================
// INICIAR
// =====================================

carregarConfiguracaoRifa();

</script>

</body>

</html>
