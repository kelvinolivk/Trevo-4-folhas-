<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pagamento Rifa Trevo4Folhas 🍀</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.caixa{
    background:#222;
    padding:20px;
    border-radius:15px;
    max-width:400px;
    margin:auto;
}

h1{
    color:#3ddc84;
}

.numero{
    font-size:45px;
    color:#ffd700;
    font-weight:bold;
    margin:20px;
}

button{
    width:90%;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:#0b8f3a;
    color:white;
    font-size:18px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="caixa">

<h1>🎟️ Rifa Trevo4Folhas 🍀</h1>

<div id="dados">
Carregando...
</div>

<button onclick="copiarPix()">
📋 Copiar Pix
</button>

<button onclick="confirmarPagamento()">
✅ Já realizei o pagamento
</button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

// =====================================
// RIFA ATUAL
// =====================================

let rifa =
JSON.parse(
    localStorage.getItem("rifaAtual")
) || null;


// =====================================
// VERIFICAR RIFA
// =====================================

if(!rifa){

    alert("Nenhuma rifa encontrada.");

    location.href="rifa.html";

}


// =====================================
// CONFIGURAÇÃO DA RIFA
// =====================================

let configuracaoRifa = {};


// =====================================
// CARREGAR CONFIGURAÇÃO DO SUPABASE
// =====================================

async function carregarConfiguracaoRifa(){

    try{

        document.getElementById("dados").innerHTML =
            "⏳ Carregando dados da Rifa...";


        const { data, error } =
            await supabaseClient
            .from("configuracoes")
            .select("valor,premio,pix")
            .eq("tipo","rifa")
            .single();


        if(error){

            throw error;

        }


        if(!data){

            throw new Error(
                "Configuração da Rifa não encontrada."
            );

        }


        configuracaoRifa = data;


        // Guarda uma cópia local somente como apoio

        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify({

                valor:data.valor || "",

                premio:data.premio || "",

                pix:data.pix || ""

            })
        );


        mostrarDados();


    }catch(error){

        console.error(
            "Erro ao carregar configuração:",
            error
        );


        document.getElementById("dados").innerHTML =

            "❌ Não foi possível carregar os dados da Rifa.<br><br>" +

            error.message;

    }

}


// =====================================
// MOSTRAR DADOS
// =====================================

function mostrarDados(){

    let pix =
        configuracaoRifa.pix || "";

    let valor =
        configuracaoRifa.valor || "10,00";

    let premio =
        configuracaoRifa.premio || "A definir";


    if(!pix){

        pix = "Pix não informado";

    }


    document.getElementById("dados").innerHTML = `

    <p>

    👤 Participante:

    <br>

    <b>
    ${rifa.nome || "Não informado"}
    </b>

    </p>


    <p>

    🎟️ Número escolhido:

    </p>


    <div class="numero">

    ${String(rifa.numero).padStart(2,"0")}

    </div>


    <p>

    💰 Valor:

    <br>

    <b>
    R$ ${valor}
    </b>

    </p>


    <p>

    🏆 Prêmio:

    <br>

    <b>
    ${premio}
    </b>

    </p>


    <p>

    💳 Pix para pagamento:

    <br>

    <b id="pix">

    ${pix}

    </b>

    </p>

    `;

}


// =====================================
// COPIAR PIX
// =====================================

function copiarPix(){

    let elemento =
        document.getElementById("pix");


    if(!elemento){

        alert(
            "⚠️ Chave Pix ainda não carregada."
        );

        return;

    }


    let pix =
        elemento.innerText.trim();


    if(
        !pix ||
        pix === "Pix não informado"
    ){

        alert(
            "⚠️ O administrador ainda não cadastrou a chave Pix da Rifa."
        );

        return;

    }


    navigator.clipboard
    .writeText(pix)

    .then(function(){

        alert(
            "🍀 Pix da Rifa copiado!"
        );

    })

    .catch(function(){

        alert(
            "❌ Não foi possível copiar o Pix."
        );

    });

}


// =====================================
// CONFIRMAR PAGAMENTO
// =====================================

async function confirmarPagamento(){

    let lista =
        JSON.parse(
            localStorage.getItem(
                "rifaParticipantes"
            )
        ) || [];


    let indice =
        lista.findIndex(function(p){

            return Number(p.numero) ===
                Number(rifa.numero) &&

                p.nome === rifa.nome;

        });


    if(indice !== -1){

        lista[indice].pagamento =
            "🟡 Aguardando confirmação";

        lista[indice].data =
            new Date()
            .toLocaleString("pt-BR");

    }


    localStorage.setItem(
        "rifaParticipantes",
        JSON.stringify(lista)
    );


    // =====================================
    // ATUALIZA TAMBÉM NO SUPABASE
    // =====================================

    try{

        const { data, error } =
            await supabaseClient

            .from("rifa_participantes")

            .select("id,numero,nome")

            .eq("numero",rifa.numero)
            .eq("nome",rifa.nome)
            .limit(1);


        if(error){

            console.error(error);

        }


        if(data && data.length > 0){

            const id =
                data[0].id;


            const { error:updateError } =

                await supabaseClient

                .from("rifa_participantes")

                .update({

                    pagamento:
                        "🟡 Aguardando confirmação"

                })

                .eq("id",id);


            if(updateError){

                console.error(
                    updateError
                );

            }

        }


    }catch(error){

        console.error(
            "Erro ao atualizar pagamento:",
            error
        );

    }


    alert(

        "🍀 Pagamento informado!\n\n" +

        "Aguarde a confirmação do administrador."

    );


    location.href =
        "rifa.html";

}


// =====================================
// INICIAR
// =====================================

carregarConfiguracaoRifa();

</script>

</body>

</html>
