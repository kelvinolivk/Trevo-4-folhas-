<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Pagamento Rifa Trevo4Folhas 🍀</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

.caixa{
    background:#222;
    padding:20px;
    border-radius:15px;
    max-width:400px;
    margin:auto;
}

h1{
    color:#3ddc84;
}

.numero{
    font-size:45px;
    color:#ffd700;
    font-weight:bold;
    margin:20px;
}

.info{
    background:#181818;
    padding:15px;
    border-radius:10px;
    margin:12px 0;
}

.pix{
    word-break:break-all;
    color:#6dff7d;
    font-weight:bold;
}

button{
    width:90%;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:#0b8f3a;
    color:white;
    font-size:18px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="caixa">

<h1>🎟️ Rifa Trevo4Folhas 🍀</h1>

<div id="dados">
⏳ Carregando dados da Rifa...
</div>

<button onclick="copiarPix()">
📋 Copiar Pix
</button>

<button onclick="confirmarPagamento()">
✅ Já realizei o pagamento
</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const rifa =
JSON.parse(
    localStorage.getItem(
        "rifaAtual"
    )
);


let configuracaoRifa = null;


/* =========================================
   VERIFICAR RIFA
========================================= */

if(!rifa){

    alert(
        "Nenhuma Rifa encontrada."
    );

    location.href =
        "rifa.html";

}


/* =========================================
   CARREGAR CONFIGURAÇÃO
========================================= */

async function carregarConfiguracaoRifa(){

    const dados =
        document.getElementById(
            "dados"
        );


    try{

        const { data,error } =

            await supabaseClient

            .from("configuracao")

            .select(
                "valor_rifa,premio_rifa,pix_rifa"
            )

            .order(
                "id",
                {ascending:false}
            )

            .limit(1);


        if(error){

            throw error;

        }


        if(
            !data ||
            data.length === 0
        ){

            throw new Error(
                "Nenhuma configuração da Rifa encontrada."
            );

        }


        configuracaoRifa =
            data[0];


        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify({

                valor:
                    configuracaoRifa.valor_rifa || "",

                premio:
                    configuracaoRifa.premio_rifa || "",

                pix:
                    configuracaoRifa.pix_rifa || ""

            })
        );


        mostrarDados();


    }catch(error){

        console.error(error);


        /*
           Se o Supabase não responder,
           tenta a cópia local.
        */

        const local =
            JSON.parse(
                localStorage.getItem(
                    "configuracaoRifa"
                )
            );


        if(local){

            configuracaoRifa = {

                valor_rifa:
                    local.valor || "",

                premio_rifa:
                    local.premio || "",

                pix_rifa:
                    local.pix || ""

            };


            mostrarDados();

            return;

        }


        dados.innerHTML =

            "❌ Não foi possível carregar os dados da Rifa." +

            "<br><br>" +

            error.message;

    }

}


/* =========================================
   MOSTRAR
========================================= */

function mostrarDados(){

    const valor =
        configuracaoRifa.valor_rifa ||
        "A definir";


    const premio =
        configuracaoRifa.premio_rifa ||
        "A definir";


    const pix =
        configuracaoRifa.pix_rifa ||
        "Pix não informado";


    document.getElementById(
        "dados"
    ).innerHTML = `

    <div class="info">

    👤 Participante:
    <br>

    <b>
    ${rifa.nome || "Não informado"}
    </b>

    </div>


    <div class="info">

    🎟️ Número escolhido:

    <div class="numero">

    ${String(
        rifa.numero
    ).padStart(2,"0")}

    </div>

    </div>


    <div class="info">

    💰 Valor da Rifa:
    <br>

    <b>
    R$ ${valor}
    </b>

    </div>


    <div class="info">

    🏆 Prêmio:
    <br>

    <b>
    ${premio}
    </b>

    </div>


    <div class="info">

    💳 Pix para pagamento:
    <br><br>

    <span
    id="pix"
    class="pix">

    ${pix}

    </span>

    </div>

    `;

}


/* =========================================
   COPIAR PIX
========================================= */

function copiarPix(){

    const elemento =
        document.getElementById(
            "pix"
        );


    if(!elemento){

        alert(
            "⚠️ Pix ainda não carregado."
        );

        return;

    }


    const pix =
        elemento.innerText.trim();


    if(
        !pix ||
        pix === "Pix não informado"
    ){

        alert(
            "⚠️ O administrador ainda não cadastrou o Pix da Rifa."
        );

        return;

    }


    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
        .writeText(pix)
        .then(function(){

            alert(
                "🍀 Pix copiado!"
            );

        })
        .catch(function(){

            alert(
                "❌ Não foi possível copiar."
            );

        });

    }else{

        alert(
            "Pix:\n\n" +
            pix
        );

    }

}


/* =========================================
   CONFIRMAR PAGAMENTO
========================================= */

async function confirmarPagamento(){

    try{

        if(!rifa){

            return;

        }


        const { data,error } =

            await supabaseClient

            .from("rifa_participantes")

            .select(
                "id,numero,nome"
            )

            .eq(
                "numero",
                rifa.numero
            )

            .eq(
                "nome",
                rifa.nome
            );


        if(error){

            throw error;

        }


        if(
            !data ||
            data.length === 0
        ){

            alert(
                "⚠️ Não encontramos sua reserva da Rifa."
            );

            return;

        }


        const id =
            data[0].id;


        const { error:updateError } =

            await supabaseClient

            .from("rifa_participantes")

            .update({

                pagamento:
                    "🟡 Aguardando confirmação"

            })

            .eq(
                "id",
                id
            );


        if(updateError){

            throw updateError;

        }


        alert(

            "🍀 Pagamento informado com sucesso!\n\n" +

            "Aguarde a confirmação do administrador."

        );


        location.href =
            "rifa.html";


    }catch(error){

        console.error(error);

        alert(

            "❌ Não foi possível informar o pagamento:\n\n" +
            error.message

        );

    }

}


/* =========================================
   INICIAR
========================================= */

carregarConfiguracaoRifa();

</script>

</body>
</html>
