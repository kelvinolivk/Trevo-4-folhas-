<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pagamento Pix - Trevo4Folhas 🍀</title>

<style>

body{

margin:0;

background:#111;

color:white;

font-family:Arial,sans-serif;

}

.container{

max-width:450px;

margin:30px auto;

background:#1d1d1d;

border-radius:20px;

padding:25px;

text-align:center;

}

h1{

color:#3ddc84;

}

.valor{

font-size:30px;

font-weight:bold;

color:#3ddc84;

margin:20px 0;

}

.info{

background:#222;

padding:12px;

border-radius:10px;

margin:10px 0;

text-align:left;

}

.pix{

background:#2b2b2b;

padding:15px;

border-radius:10px;

word-break:break-all;

margin:20px 0;

}

button{

width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:10px;

background:#19a34a;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#14853c;

}

.aviso{

margin-top:20px;

color:#ccc;

font-size:14px;

}

</style>

</head>

<body>

<div class="container">

<h1>🍀 Trevo4Folhas</h1>

<p>

Finalize sua aposta realizando o pagamento.

</p>

<div class="valor" id="valor">

Carregando...

</div>

<div class="info" id="dados">

Carregando participante...

</div>

<h3>

Chave Pix

</h3>

<div class="pix" id="chavePix">

CPF: 013.050.129-84

</div>

<button onclick="copiarPix()">

📋 Copiar chave Pix

</button>

<button onclick="confirmarPagamento()">

✅ Já realizei o pagamento

</button>

<button onclick="enviarWhatsApp()">

📲 Enviar comprovante pelo WhatsApp

</button>

<p class="aviso">

Após a confirmação do administrador sua aposta estará válida.

</p>

</div>

<script>

let cadastro =

JSON.parse(localStorage.getItem("cadastro")) || {};

let configuracao =

JSON.parse(localStorage.getItem("configuracao")) || {};

let numeros =

JSON.parse(localStorage.getItem("numeroEscolhido")) || [];

document.getElementById("valor").innerHTML =

"R$ " +

(configuracao.valorAposta || "0,00");

document.getElementById("dados").innerHTML =

"👤 <b>"+cadastro.nome+"</b><br><br>"+

"📱 "+cadastro.whatsapp+"<br><br>"+

"💳 Pix: "+cadastro.pix+"<br><br>"+

"📍 "+(cadastro.cidade || "-")+"<br><br>"+

"🍀 Números: "+numeros.join(" - ");
