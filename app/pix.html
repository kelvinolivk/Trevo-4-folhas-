<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento Pix - Trevo4Folhas 🍀</title>

<style>

body{

margin:0;

background:#111;

color:white;

font-family:Arial,sans-serif;

}


.container{

max-width:450px;

margin:30px auto;

background:#1d1d1d;

border-radius:20px;

padding:25px;

text-align:center;

}


h1{

color:#3ddc84;

}


.valor{

font-size:30px;

font-weight:bold;

color:#3ddc84;

margin:20px 0;

}


.info{

background:#222;

padding:15px;

border-radius:10px;

margin:15px 0;

text-align:left;

}


.pix{

background:#2b2b2b;

padding:15px;

border-radius:10px;

word-break:break-all;

margin:20px 0;

}


button{

width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:10px;

background:#19a34a;

color:white;

font-size:16px;

cursor:pointer;

}


button:hover{

background:#14853c;

}


.aviso{

margin-top:20px;

color:#ccc;

font-size:14px;

}


</style>

</head>


<body>


<div class="container">


<h1>🍀 Trevo4Folhas</h1>


<p>

Finalize sua aposta realizando o pagamento.

</p>


<div class="valor" id="valor">

Carregando...

</div>


<div class="info" id="dados">

Carregando dados...

</div>


<h3>

Chave Pix

</h3>


<div class="pix" id="chavePix">

CPF: 013.050.129-84

</div>


<button onclick="copiarPix()">

📋 Copiar chave Pix

</button>


<button onclick="confirmarPagamento()">

✅ Já realizei o pagamento

</button>


<button onclick="enviarWhatsApp()">

📲 Enviar comprovante pelo WhatsApp

</button>


<p class="aviso">

Após a confirmação do administrador sua aposta estará válida.

</p>


</div>


<script>


let cadastro =

JSON.parse(localStorage.getItem("cadastro")) || {};


let numeroEscolhido =

JSON.parse(localStorage.getItem("numeroEscolhido")) || [];


let configuracao =

JSON.parse(localStorage.getItem("configuracao")) || {};


let valorAposta =

configuracao.valorAposta || "5,00";


document.getElementById("valor").innerHTML =

"R$ " + valorAposta;


document.getElementById("dados").innerHTML =


"👤 <b>"+(cadastro.nome || "Não informado")+"</b><br><br>"+

"📱 "+(cadastro.whatsapp || "")+"<br><br>"+

"💳 Pix: "+(cadastro.pix || "")+"<br><br>"+

"📍 "+(cadastro.cidade || "")+"<br><br>"+

"🍀 Números: "+numeroEscolhido.join(" - ");
  function copiarPix(){

navigator.clipboard.writeText(

document.getElementById("chavePix").innerText

);

alert("✅ Chave Pix copiada!");

}



function confirmarPagamento(){


let participantes =

JSON.parse(localStorage.getItem("participantes")) || [];



for(let i = participantes.length - 1; i >= 0; i--){


let aposta = participantes[i];



if(

aposta.nome == cadastro.nome &&

aposta.numero == JSON.stringify(numeroEscolhido)

){


aposta.pagamento =

"🟡 Aguardando confirmação";



break;


}


}



localStorage.setItem(

"participantes",

JSON.stringify(participantes)

);



alert(

"🍀 Pagamento informado com sucesso!\n\nAguarde a confirmação do administrador."

);


}




function enviarWhatsApp(){


let mensagem =


"🍀 Olá! Acabei de realizar o pagamento da minha aposta no Trevo4Folhas.\n\n"+

"👤 Nome: "+(cadastro.nome || "")+

"\n📱 WhatsApp: "+(cadastro.whatsapp || "")+

"\n🍀 Números: "+numeroEscolhido.join(" - ")+

"\n\nEstou enviando o comprovante para confirmação.";



let texto = encodeURIComponent(mensagem);



window.location.href =

"https://wa.me/5542999330894?text=" + texto;



}

// Verificações de segurança

if(!cadastro.nome){

alert("Faça seu cadastro primeiro 🍀");

window.location.href="cadastro.html";

}



if(numeroEscolhido.length == 0){

alert("Escolha seus números primeiro 🍀");

window.location.href="numeros.html";

}


</script>


</body>


</html>
