<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento Pix - Trevo4Folhas 🍀</title>

<style>

body{

margin:0;

background:#111;

color:white;

font-family:Arial,sans-serif;

}

.container{

max-width:450px;

margin:30px auto;

background:#1d1d1d;

border-radius:20px;

padding:25px;

text-align:center;

}

h1{

color:#3ddc84;

}

.valor{

font-size:30px;

font-weight:bold;

color:#3ddc84;

margin:20px 0;

}

.info{

background:#222;

padding:15px;

border-radius:10px;

margin:15px 0;

text-align:left;

}

.pix{

background:#2b2b2b;

padding:15px;

border-radius:10px;

word-break:break-all;

margin:20px 0;

}

button{

width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:10px;

background:#19a34a;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#14853c;

}

.aviso{

margin-top:20px;

color:#ccc;

font-size:14px;

}

</style>

</head>

<body>

<div class="container">

<h1>🍀 Trevo4Folhas</h1>

<p>

Finalize sua aposta realizando o pagamento.

</p>

<div class="valor" id="valor">

Carregando...

</div>

<div class="info" id="dados">

Carregando dados...

</div>

<h3>

Chave Pix

</h3>

<div class="pix" id="chavePix">

Carregando...

</div>

<button onclick="copiarPix()">

📋 Copiar chave Pix

</button>

<button id="botaoPagamento" onclick="confirmarPagamento()">

✅ Já realizei o pagamento

</button>

<button onclick="enviarWhatsApp()">

📲 Enviar comprovante pelo WhatsApp

</button>

<p class="aviso">

Após a confirmação do administrador sua aposta estará válida.

</p>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


// =====================================
// DADOS DO PARTICIPANTE
// =====================================

let cadastro =

JSON.parse(

localStorage.getItem("cadastro")

) || {};


let numeroEscolhido =

JSON.parse(

localStorage.getItem("numeroEscolhido")

) || [];


let configuracao =

JSON.parse(

localStorage.getItem("configuracao")

) || {};


// =====================================
// VALOR DA APOSTA
// =====================================

let valorAposta =

configuracao.valorAposta || "5,00";


document.getElementById("valor").innerHTML =

"R$ " + valorAposta;


// =====================================
// DADOS DA APOSTA
// =====================================

document.getElementById("dados").innerHTML =

"👤 <b>"+

(cadastro.nome || "Não informado")+

"</b><br><br>"+

"📱 "+

(cadastro.whatsapp || "")+

"<br><br>"+

"💳 Pix cadastrado: "+

(cadastro.pix || "Não informado")+

"<br><br>"+

"📍 "+

(cadastro.cidade || "")+

"<br><br>"+

"🍀 Números: "+

numeroEscolhido.join(" - ");


// =====================================
// CHAVE PIX DO ADMIN
// =====================================

// Usa a chave Pix configurada pelo Admin.
// Se ainda não houver configuração,
// mostra aviso em vez de usar Pix antigo.

let chavePix =

configuracao.pix ||

configuracao.chavePix ||

"Pix não configurado pelo administrador";


document.getElementById("chavePix").innerText =

chavePix;


// =====================================
// COPIAR PIX
// =====================================

function copiarPix(){

let pix =

document.getElementById("chavePix").innerText;


if(

!pix ||

pix === "Pix não configurado pelo administrador"

){

alert(

"⚠️ O administrador ainda não configurou a chave Pix."

);

return;

}


navigator.clipboard.writeText(pix)

.then(function(){

alert("🍀 Chave Pix copiada!");

})

.catch(function(){

alert("Não foi possível copiar a chave Pix.");

});

}


// =====================================
// CONFIRMAR PAGAMENTO
// =====================================

async function confirmarPagamento(){


if(

!cadastro.nome ||

numeroEscolhido.length === 0

){

alert(

"⚠️ Não foi possível identificar sua aposta."

);

return;

}


let botao =

document.getElementById("botaoPagamento");


botao.disabled = true;

botao.innerText = "⏳ Enviando...";


try{


// Procura a aposta no Supabase

const { data, error } =

await supabaseClient

.from("participantes")

.select("*")

.eq("nome", cadastro.nome)

.eq(

"numero",

JSON.stringify(numeroEscolhido)

)

.order("id", {

ascending:false

})

.limit(1);


if(error){

console.error(error);

throw error;

}


if(!data || data.length === 0){

alert(

"❌ Não encontramos sua aposta no sistema."

);

botao.disabled = false;

botao.innerText =

"✅ Já realizei o pagamento";

return;

}


let aposta = data[0];


// Atualiza o pagamento no Supabase

const { error: erroAtualizacao } =

await supabaseClient

.from("participantes")

.update({

pagamento:

"🟡 Aguardando confirmação"

})

.eq("id", aposta.id);


if(erroAtualizacao){

console.error(erroAtualizacao);

throw erroAtualizacao;

}


alert(

"🍀 Pagamento informado com sucesso!\n\n"+

"Aguarde a confirmação do administrador."

);


botao.innerText =

"🟡 Pagamento informado";


}catch(error){

console.error(

"Erro Supabase:",

error

);

alert(

"❌ Não foi possível informar o pagamento:\n\n"+

error.message

);


botao.disabled = false;

botao.innerText =

"✅ Já realizei o pagamento";

}

}


// =====================================
// WHATSAPP
// =====================================

function enviarWhatsApp(){


let mensagem =

"🍀 Olá! Acabei de realizar o pagamento da minha aposta no Trevo4Folhas.\n\n"+

"👤 Nome: "+

(cadastro.nome || "")+

"\n📱 WhatsApp: "+

(cadastro.whatsapp || "")+

"\n🍀 Números: "+

numeroEscolhido.join(" - ")+

"\n\nEstou enviando o comprovante para confirmação.";


let texto =

encodeURIComponent(mensagem);


window.location.href =

"https://wa.me/5542999330894?text=" +

texto;

}


// =====================================
// SEGURANÇA
// =====================================

if(!cadastro.nome){

alert(

"Faça seu cadastro primeiro 🍀"

);

window.location.href =

"cadastro.html";

}


if(numeroEscolhido.length === 0){

alert(

"Escolha seus números primeiro 🍀"

);

window.location.href =

"numeros.html";

}

</script>

</body>

</html>
