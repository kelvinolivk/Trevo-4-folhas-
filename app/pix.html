<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento Pix - Trevo4Folhas 🍀</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:450px;
    margin:30px auto;
    background:#1d1d1d;
    border-radius:20px;
    padding:25px;
    text-align:center;
}

h1{
    color:#3ddc84;
}

.valor{
    font-size:30px;
    font-weight:bold;
    color:#3ddc84;
    margin:20px 0;
}

.pix{
    background:#2b2b2b;
    padding:15px;
    border-radius:10px;
    word-break:break-all;
    margin:20px 0;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    background:#19a34a;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#14853c;
}

.aviso{
    margin-top:20px;
    color:#ccc;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<h1>🍀 Trevo4Folhas</h1>

<p>Finalize sua aposta realizando o pagamento.</p>

<div class="valor">
R$ 5,00
</div>
<h3 id="nome"></h3>
<h3 id="numero"></h3>
<h3>Chave Pix</h3>

<div class="pix" id="chavePix">
SUA_CHAVE_PIX
</div>

<button onclick="copiarPix()">
📋 Copiar chave Pix
</button>

<button onclick="confirmarPagamento()">
✅ Já realizei o pagamento
</button>

<p class="aviso">
Após a confirmação do administrador sua aposta estará válida.
</p>

</div>

<script>

function copiarPix(){

navigator.clipboard.writeText(
document.getElementById("chavePix").innerText
);

alert("Chave Pix copiada!");

}

function confirmarPagamento(){

alert("Recebemos sua confirmação. Aguarde a validação do administrador.");

location.href="index.html";

}
let nome = localStorage.getItem("nome") || "";
let numero = localStorage.getItem("numeroEscolhido") || "";

document.getElementById("nome").innerHTML =
"👤 Participante: " + nome;

document.getElementById("numero").innerHTML =
"🍀 Número escolhido: " + numero;
</script>

</body>
</html>
