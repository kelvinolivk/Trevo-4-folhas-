<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rifa Trevo4Folhas 🍀</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#071307;
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
    padding:15px;
}

h1{
    margin-top:20px;
    font-size:34px;
    color:#6dff7d;
    text-shadow:0 0 15px #00ff55;
}

p{
    margin:15px;
    font-size:18px;
}

#configuracao{
    max-width:430px;
    margin:15px auto 20px;
    background:#111f14;
    border:1px solid #00ff66;
    border-radius:15px;
    padding:15px;
}

#configuracao div{
    margin:8px 0;
}

#contador{
    margin:15px;
    font-size:22px;
    font-weight:bold;
}

#numeros{
    max-width:430px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    padding:10px;
}

.numero{
    height:60px;
    background:#114d20;
    border:2px solid #00ff66;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 0 10px #0f0;
}

.numero:hover{
    transform:scale(1.06);
}

.escolhido{
    background:#ffd700;
    color:black;
    box-shadow:0 0 20px gold;
}

.vendido{
    background:#c40000;
    border:2px solid #ff5555;
    color:white;
    cursor:not-allowed;
    box-shadow:0 0 15px red;
}

button{
    margin-top:20px;
    width:90%;
    max-width:400px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#0b8f3a;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

</style>

</head>

<body>

<h1>🎟️ Rifa Trevo4Folhas 🍀</h1>

<p>
Escolha um número de 1 a 100
</p>


<div id="configuracao">

⏳ Carregando informações da Rifa...

</div>


<h2 id="contador">

Carregando números...

</h2>


<div id="numeros"></div>


<button id="botaoConfirmar"
onclick="confirmarRifa()"
disabled>

✅ Confirmar número

</button>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

let numeroEscolhido = null;

let area =
document.getElementById("numeros");

let botaoConfirmar =
document.getElementById("botaoConfirmar");


// =====================================
// CARREGAR CONFIGURAÇÃO DA RIFA
// =====================================

async function carregarConfiguracaoRifa(){

    try{

        document.getElementById(
            "configuracao"
        ).innerHTML =
            "⏳ Carregando informações da Rifa...";


        const { data, error } =

            await supabaseClient

            .from("configuracoes")

            .select("valor,premio,pix")

            .eq("tipo","rifa")

            .single();


        if(error){

            console.error(
                "Erro configuração Rifa:",
                error
            );


            document.getElementById(
                "configuracao"
            ).innerHTML =

                "❌ Não foi possível carregar as informações da Rifa.<br><br>" +

                error.message;

            return;

        }


        if(!data){

            document.getElementById(
                "configuracao"
            ).innerHTML =

                "🎟️ <b>Rifa Trevo4Folhas</b><br><br>" +

                "💰 Valor: A definir<br><br>" +

                "🏆 Prêmio: A definir<br><br>" +

                "💳 Pix: A definir";

            return;

        }


        // =====================================
        // SALVA CONFIGURAÇÃO LOCALMENTE
        // APENAS COMO CÓPIA
        // =====================================

        localStorage.setItem(

            "configuracaoRifa",

            JSON.stringify({

                valor:data.valor || "",

                premio:data.premio || "",

                pix:data.pix || ""

            })

        );


        // =====================================
        // MOSTRAR CONFIGURAÇÃO
        // =====================================

        document.getElementById(
            "configuracao"
        ).innerHTML =

            "🎟️ <b>Rifa Trevo4Folhas</b><br><br>" +

            "💰 <b>Valor:</b> " +

            (data.valor || "A definir") +

            "<br><br>" +

            "🏆 <b>Prêmio:</b> " +

            (data.premio || "A definir") +

            "<br><br>" +

            "💳 <b>Pix para pagamento:</b><br>" +

            (data.pix || "A definir");


    }catch(error){

        console.error(error);


        document.getElementById(
            "configuracao"
        ).innerHTML =

            "❌ Erro ao carregar informações da Rifa.";

    }

}


// =====================================
// CARREGAR NÚMEROS DO SUPABASE
// =====================================

async function carregarRifa(){

    try{

        document.getElementById(
            "contador"
        ).innerHTML =
            "⏳ Carregando números...";


        const { data, error } =

            await supabaseClient

            .from("rifa_participantes")

            .select(
                "nome,whatsapp,numero,pagamento"
            );


        if(error){

            console.error(
                "Erro Supabase:",
                error
            );


            document.getElementById(
                "contador"
            ).innerHTML =
                "❌ Erro ao carregar a Rifa";


            alert(
                "❌ Erro ao carregar a Rifa:\n" +
                error.message
            );


            return;

        }


        let participantes =
            data || [];


        localStorage.setItem(

            "rifaParticipantes",

            JSON.stringify(
                participantes
            )

        );


        criarNumeros(
            participantes
        );


    }catch(error){

        console.error(error);


        document.getElementById(
            "contador"
        ).innerHTML =
            "❌ Erro de conexão";


        alert(
            "❌ Erro de conexão com o Supabase:\n" +
            error.message
        );

    }

}


// =====================================
// CRIAR NÚMEROS 1 A 100
// =====================================

function criarNumeros(participantes){

    area.innerHTML = "";

    numeroEscolhido = null;

    botaoConfirmar.disabled = true;


    document.getElementById(
        "contador"
    ).innerHTML =
        "Número escolhido: Nenhum";


    for(let i = 1; i <= 100; i++){

        let botao =
            document.createElement("div");


        botao.className =
            "numero";


        botao.innerHTML =
            i.toString().padStart(2,"0");


        let reservado =
            participantes.find(
                function(p){

                    return Number(p.numero) === i;

                }
            );


        if(reservado){

            botao.classList.add(
                "vendido"
            );

        }else{

            botao.onclick =
                function(){

                    document
                    .querySelectorAll(
                        ".numero"
                    )
                    .forEach(
                        function(n){

                            if(
                                !n.classList.contains(
                                    "vendido"
                                )
                            ){

                                n.classList.remove(
                                    "escolhido"
                                );

                            }

                        }
                    );


                    numeroEscolhido =
                        i;


                    botao.classList.add(
                        "escolhido"
                    );


                    document.getElementById(
                        "contador"
                    ).innerHTML =

                        "Número escolhido: " +

                        i.toString()
                        .padStart(2,"0");


                    botaoConfirmar.disabled =
                        false;

                };

        }


        area.appendChild(
            botao
        );

    }

}


// =====================================
// CONFIRMAR RIFA
// =====================================

async function confirmarRifa(){

    if(
        numeroEscolhido == null
    ){

        alert(
            "Escolha um número da Rifa 🍀"
        );

        return;

    }


    let cadastro =

        JSON.parse(

            localStorage.getItem(
                "cadastro"
            )

        );


    if(
        !cadastro ||
        !cadastro.nome ||
        !cadastro.whatsapp
    ){

        alert(
            "Faça o cadastro antes de participar."
        );


        location.href =
            "cadastro.html";


        return;

    }


    botaoConfirmar.disabled =
        true;


    botaoConfirmar.innerHTML =
        "⏳ Salvando...";


    document.getElementById(
        "contador"
    ).innerHTML =
        "⏳ Salvando sua reserva...";


    try{


        // =====================================
        // VERIFICA NOVAMENTE NO SUPABASE
        // =====================================

        const {
            data:existente,
            error:erroBusca
        } =

            await supabaseClient

            .from("rifa_participantes")

            .select(
                "id,numero"
            )

            .eq(
                "numero",
                numeroEscolhido
            );


        if(erroBusca){

            throw erroBusca;

        }


        if(
            existente &&
            existente.length > 0
        ){

            alert(
                "⚠️ Esse número acabou de ser reservado por outra pessoa."
            );


            botaoConfirmar.disabled =
                false;


            botaoConfirmar.innerHTML =
                "✅ Confirmar número";


            await carregarRifa();


            return;

        }


        // =====================================
        // NOVA RESERVA
        // =====================================

        let participante = {

            nome:
                cadastro.nome,

            whatsapp:
                cadastro.whatsapp,

            numero:
                numeroEscolhido,

            pagamento:
                "🟡 Aguardando pagamento"

        };


        const {
            data,
            error
        } =

            await supabaseClient

            .from("rifa_participantes")

            .insert([
                participante
            ])

            .select();


        if(error){

            console.error(
                "Erro Supabase:",
                error
            );


            alert(
                "❌ Erro ao salvar a Rifa:\n" +
                error.message
            );


            botaoConfirmar.disabled =
                false;


            botaoConfirmar.innerHTML =
                "✅ Confirmar número";


            return;

        }


        // =====================================
        // ATUALIZA LOCAL
        // =====================================

        let rifa =

            JSON.parse(

                localStorage.getItem(
                    "rifaParticipantes"
                )

            ) || [];


        rifa =
            rifa.filter(
                function(p){

                    return Number(p.numero) !==
                        Number(numeroEscolhido);

                }
            );


        rifa.push(
            participante
        );


        localStorage.setItem(

            "rifaParticipantes",

            JSON.stringify(
                rifa
            )

        );


        // =====================================
        // SALVA RIFA ATUAL
        // =====================================

        localStorage.setItem(

            "rifaAtual",

            JSON.stringify({

                nome:
                    cadastro.nome,

                whatsapp:
                    cadastro.whatsapp,

                numero:
                    numeroEscolhido

            })

        );


        alert(

            "🍀 Número " +

            numeroEscolhido +

            " reservado com sucesso!"

        );


        location.href =
            "pix-rifa.html";


    }catch(error){

        console.error(
            "Erro:",
            error
        );


        alert(
            "❌ Erro de conexão com o Supabase:\n" +
            error.message
        );


        botaoConfirmar.disabled =
            false;


        botaoConfirmar.innerHTML =
            "✅ Confirmar número";


        document.getElementById(
            "contador"
        ).innerHTML =

            "Número escolhido: " +

            numeroEscolhido;

    }

}


// =====================================
// INICIAR
// =====================================

carregarConfiguracaoRifa();

carregarRifa();

</script>

</body>

</html>
