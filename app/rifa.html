<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rifa Trevo4Folhas 🍀</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#071307;
font-family:Arial;
color:white;
text-align:center;
padding:15px;

}

h1{

margin-top:20px;
color:#6dff7d;
font-size:32px;
text-shadow:0 0 15px #00ff55;

}

p{

margin:15px;

}


#numeros{

max-width:430px;
margin:20px auto;

display:grid;

grid-template-columns:repeat(5,1fr);

gap:10px;

}


.numero{

height:55px;

background:#114d20;

border:2px solid #00ff66;

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

font-weight:bold;

cursor:pointer;

box-shadow:0 0 10px #0f0;

}


.numero:hover{

transform:scale(1.05);

}


.escolhido{

background:#ffd700;

color:black;

box-shadow:0 0 20px gold;

}


button{

margin-top:20px;

width:90%;

max-width:400px;

padding:15px;

border:none;

border-radius:12px;

background:#0b8f3a;

color:white;

font-size:18px;

font-weight:bold;

}

</style>

</head>


<body>


<h1>🎟️ Rifa Trevo4Folhas 🍀</h1>

<p>
Escolha seu número de 1 a 100
</p>


<h2 id="contador">
Número escolhido: Nenhum
</h2>


<div id="numeros"></div>


<button onclick="confirmarRifa()">

✅ Confirmar número

</button>


<script>


let numeroEscolhido = null;


let area = document.getElementById("numeros");



for(let i=1;i<=100;i++){


let botao=document.createElement("div");


botao.className="numero";


botao.innerHTML=i.toString().padStart(2,"0");



botao.onclick=function(){


if(numeroEscolhido){

document.querySelectorAll(".numero")
.forEach(function(n){

n.classList.remove("escolhido");

});

}



numeroEscolhido=i;


botao.classList.add("escolhido");


document.getElementById("contador").innerHTML =
" Número escolhido: "+i.toString().padStart(2,"0");


};



area.appendChild(botao);


}



function confirmarRifa(){


if(numeroEscolhido==null){

alert("Escolha um número da rifa 🍀");

return;

}


localStorage.setItem(
"numeroRifa",
numeroEscolhido
);


alert(
"Número "+numeroEscolhido+
" reservado! 🍀"
);


// futuramente vai para cadastro/pagamento

}



</script>


</body>

</html>
