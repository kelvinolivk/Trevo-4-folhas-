<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rifa Trevo4Folhas 🍀</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#071307;
font-family:Arial,sans-serif;
color:white;
text-align:center;
padding:15px;
}

h1{
margin-top:20px;
font-size:34px;
color:#6dff7d;
text-shadow:0 0 15px #00ff55;
}

p{
margin:15px;
font-size:18px;
}

#contador{
margin:15px;
font-size:22px;
font-weight:bold;
}

#numeros{
max-width:430px;
margin:auto;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
padding:10px;
}

.numero{
height:60px;
background:#114d20;
border:2px solid #00ff66;
border-radius:12px;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.25s;
box-shadow:0 0 10px #0f0;
}

.numero:hover{
transform:scale(1.06);
}

.escolhido{
background:#ffd700;
color:black;
box-shadow:0 0 20px gold;
}

.vendido{
background:#c40000;
border:2px solid #ff5555;
color:white;
cursor:not-allowed;
box-shadow:0 0 15px red;
}

button{
margin-top:20px;
width:90%;
max-width:400px;
padding:15px;
border:none;
border-radius:12px;
background:#0b8f3a;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<h1>🎟️ Rifa Trevo4Folhas 🍀</h1>

<p>
Escolha um número de 1 a 100
</p>

<h2 id="contador">
Número escolhido: Nenhum
</h2>

<div id="numeros"></div>

<button onclick="confirmarRifa()">
✅ Confirmar número
</button>

<script>

let numeroEscolhido=null;

let area=document.getElementById("numeros");

let participantes=
JSON.parse(localStorage.getItem("rifaParticipantes"))||[];

for(let i=1;i<=100;i++){

let botao=document.createElement("div");

botao.className="numero";

botao.innerHTML=i.toString().padStart(2,"0");

let reservado=participantes.find(function(p){

return Number(p.numero)===i;

});

if(reservado){

botao.classList.add("vendido");

}else{

botao.onclick=function(){

document.querySelectorAll(".numero").forEach(function(n){

if(!n.classList.contains("vendido")){

n.classList.remove("escolhido");

}

});

numeroEscolhido=i;

botao.classList.add("escolhido");

document.getElementById("contador").innerHTML=
"Número escolhido: "+i.toString().padStart(2,"0");

};

}

area.appendChild(botao);

}

async function confirmarRifa(){

    if(numeroEscolhido == null){

        alert("Escolha um número da rifa 🍀");
        return;

    }


    let cadastro =
        JSON.parse(localStorage.getItem("cadastro"));


    if(!cadastro || !cadastro.nome || !cadastro.whatsapp){

        alert("Faça o cadastro antes de participar.");

        location.href = "cadastro.html";

        return;

    }


    let rifa =
        JSON.parse(localStorage.getItem("rifaParticipantes")) || [];


    let existe = rifa.find(function(p){

        return Number(p.numero) === Number(numeroEscolhido);

    });


    if(existe){

        alert("Esse número já foi reservado.");

        return;

    }


    let participante = {

        nome: cadastro.nome,

        whatsapp: cadastro.whatsapp,

        numero: numeroEscolhido,

        pagamento: "🟡 Aguardando pagamento"

    };


    document.getElementById("contador").innerHTML =
        "⏳ Salvando sua reserva...";


    const { data, error } = await supabaseClient

        .from("rifa_participantes")

        .insert([participante])

        .select();


    if(error){

        console.error(error);

        alert(
            "❌ Erro ao salvar a Rifa:\n" +
            error.message
        );

        document.getElementById("contador").innerHTML =
            "Número escolhido: " +
            numeroEscolhido;

        return;

    }


    // Mantém também uma cópia local para a tela funcionar

    rifa.push(participante);

    localStorage.setItem(

        "rifaParticipantes",

        JSON.stringify(rifa)

    );


    localStorage.setItem(

        "rifaAtual",

        JSON.stringify({

            nome: cadastro.nome,

            whatsapp: cadastro.whatsapp,

            numero: numeroEscolhido

        })

    );


    alert(

        "🍀 Número " +

        numeroEscolhido +

        " reservado com sucesso!"

    );


    location.href = "pix-rifa.html";

}


</script>

</body>

</html>
