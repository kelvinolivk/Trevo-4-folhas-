<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rifa Trevo4Folhas 🍀</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#071307;
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
    padding:15px;
}

h1{
    margin-top:20px;
    font-size:34px;
    color:#6dff7d;
    text-shadow:0 0 15px #00ff55;
}

p{
    margin:15px;
    font-size:18px;
}

#configuracao{
    max-width:430px;
    margin:15px auto 20px;
    background:#111f14;
    border:1px solid #00ff66;
    border-radius:15px;
    padding:15px;
    font-size:18px;
    line-height:1.5;
}

#contador{
    margin:15px;
    font-size:22px;
    font-weight:bold;
}

#numeros{
    max-width:430px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    padding:10px;
}

.numero{
    height:60px;
    background:#114d20;
    border:2px solid #00ff66;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 0 10px #0f0;
}

.numero:hover{
    transform:scale(1.06);
}

.escolhido{
    background:#ffd700;
    color:black;
    box-shadow:0 0 20px gold;
}

.vendido{
    background:#c40000;
    border:2px solid #ff5555;
    color:white;
    cursor:not-allowed;
    box-shadow:0 0 15px red;
}

button{
    margin-top:20px;
    width:90%;
    max-width:400px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#0b8f3a;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

</style>

</head>


<body>

<h1>🎟️ Rifa Trevo4Folhas 🍀</h1>

<p>
Escolha um número de 1 a 100
</p>


<div id="configuracao">
⏳ Carregando informações da Rifa...
</div>


<h2 id="contador">
⏳ Carregando números...
</h2>


<div id="numeros"></div>


<button
    id="botaoConfirmar"
    onclick="confirmarRifa()"
    disabled
>
    ✅ Confirmar número
</button>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

let numeroEscolhido = null;

const area =
    document.getElementById("numeros");

const botaoConfirmar =
    document.getElementById("botaoConfirmar");


// ==================================================
// CARREGAR CONFIGURAÇÃO DA RIFA
// ==================================================

async function carregarConfiguracaoRifa(){

    const configuracao =
        document.getElementById("configuracao");

    try{

        const { data, error } =
            await supabaseClient
            .from("configuracoes")
            .select("valor,premio,pix")
            .eq("tipo","rifa")
            .limit(1);

        if(error){

            console.error(
                "Erro ao carregar configuração da Rifa:",
                error
            );

            configuracao.innerHTML =
                "❌ Erro ao carregar a configuração da Rifa.<br><br>" +
                error.message;

            return;
        }


        if(!data || data.length === 0){

            configuracao.innerHTML =
                "🎟️ <b>Rifa Trevo4Folhas</b><br><br>" +
                "💰 <b>Valor:</b> A definir<br><br>" +
                "🏆 <b>Prêmio:</b> A definir<br><br>" +
                "💳 <b>Pix:</b> A definir";

            return;
        }


        const config = data[0];


        // Guarda a configuração para o pix-rifa.html

        const configuracaoRifa = {

            valor:
                config.valor || "",

            premio:
                config.premio || "",

            pix:
                config.pix || ""

        };


        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify(configuracaoRifa)
        );


        // Mostra na tela

        configuracao.innerHTML =

            "🎟️ <b>Rifa Trevo4Folhas</b><br><br>" +

            "💰 <b>Valor:</b> " +
            (config.valor || "A definir") +

            "<br><br>" +

            "🏆 <b>Prêmio:</b> " +
            (config.premio || "A definir") +

            "<br><br>" +

            "💳 <b>Pix:</b> " +
            (config.pix || "A definir");


    }catch(error){

        console.error(
            "Erro inesperado:",
            error
        );

        configuracao.innerHTML =
            "❌ Erro ao carregar a Rifa.<br><br>" +
            error.message;

    }

}


// ==================================================
// CARREGAR NÚMEROS DA RIFA
// ==================================================

async function carregarRifa(){

    const contador =
        document.getElementById("contador");

    try{

        contador.innerHTML =
            "⏳ Carregando números...";


        const { data, error } =
            await supabaseClient
            .from("rifa_participantes")
            .select("nome,whatsapp,numero,pagamento");


        if(error){

            console.error(
                "Erro ao carregar números:",
                error
            );

            contador.innerHTML =
                "❌ Erro ao carregar os números.";

            area.innerHTML =
                "<div style='grid-column:1/-1;padding:20px'>" +
                error.message +
                "</div>";

            return;
        }


        const participantes =
            data || [];


        localStorage.setItem(
            "rifaParticipantes",
            JSON.stringify(participantes)
        );


        criarNumeros(participantes);


    }catch(error){

        console.error(
            "Erro de conexão:",
            error
        );

        contador.innerHTML =
            "❌ Erro de conexão.";

        area.innerHTML =
            "<div style='grid-column:1/-1;padding:20px'>" +
            error.message +
            "</div>";

    }

}


// ==================================================
// CRIAR NÚMEROS 1 A 100
// ==================================================

function criarNumeros(participantes){

    area.innerHTML = "";

    numeroEscolhido = null;

    botaoConfirmar.disabled = true;

    document.getElementById("contador").innerHTML =
        "Número escolhido: Nenhum";


    for(let i = 1; i <= 100; i++){

        const botao =
            document.createElement("div");


        botao.className =
            "numero";


        botao.innerHTML =
            i.toString().padStart(2,"0");


        const reservado =
            participantes.some(function(p){

                return Number(p.numero) === i;

            });


        if(reservado){

            botao.classList.add("vendido");

        }else{

            botao.onclick =
                function(){

                    document
                    .querySelectorAll(".numero")
                    .forEach(function(n){

                        if(
                            !n.classList.contains("vendido")
                        ){

                            n.classList.remove(
                                "escolhido"
                            );

                        }

                    });


                    numeroEscolhido = i;


                    botao.classList.add(
                        "escolhido"
                    );


                    document.getElementById(
                        "contador"
                    ).innerHTML =

                        "Número escolhido: " +

                        i.toString().padStart(2,"0");


                    botaoConfirmar.disabled =
                        false;

                };

        }


        area.appendChild(botao);

    }

}


// ==================================================
// CONFIRMAR NÚMERO
// ==================================================

async function confirmarRifa(){

    if(numeroEscolhido === null){

        alert(
            "🍀 Escolha um número da Rifa."
        );

        return;
    }


    const cadastro =
        JSON.parse(
            localStorage.getItem("cadastro")
        );


    if(
        !cadastro ||
        !cadastro.nome ||
        !cadastro.whatsapp
    ){

        alert(
            "Faça o cadastro antes de participar."
        );

        location.href =
            "cadastro.html";

        return;
    }


    botaoConfirmar.disabled =
        true;

    botaoConfirmar.innerHTML =
        "⏳ Salvando...";


    try{

        // Verifica novamente se o número
        // já foi reservado

        const {
            data: existente,
            error: erroBusca
        } =

            await supabaseClient
            .from("rifa_participantes")
            .select("id,numero")
            .eq("numero",numeroEscolhido);


        if(erroBusca){

            throw erroBusca;

        }


        if(
            existente &&
            existente.length > 0
        ){

            alert(
                "⚠️ Esse número acabou de ser reservado por outra pessoa."
            );

            botaoConfirmar.disabled =
                false;

            botaoConfirmar.innerHTML =
                "✅ Confirmar número";

            await carregarRifa();

            return;
        }


        // Reserva

        const participante = {

            nome:
                cadastro.nome,

            whatsapp:
                cadastro.whatsapp,

            numero:
                numeroEscolhido,

            pagamento:
                "🟡 Aguardando pagamento"

        };


        const {
            data,
            error
        } =

            await supabaseClient
            .from("rifa_participantes")
            .insert([
                participante
            ])
            .select();


        if(error){

            throw error;

        }


        // Guarda localmente também

        let rifa =
            JSON.parse(
                localStorage.getItem(
                    "rifaParticipantes"
                )
            ) || [];


        rifa =
            rifa.filter(function(p){

                return Number(p.numero) !==
                    Number(numeroEscolhido);

            });


        rifa.push(
            participante
        );


        localStorage.setItem(
            "rifaParticipantes",
            JSON.stringify(rifa)
        );


        // Guarda a rifa atual

        localStorage.setItem(
            "rifaAtual",
            JSON.stringify({

                nome:
                    cadastro.nome,

                whatsapp:
                    cadastro.whatsapp,

                numero:
                    numeroEscolhido

            })
        );


        alert(
            "🍀 Número " +
            numeroEscolhido +
            " reservado com sucesso!"
        );


        // Vai para o pagamento da Rifa

        location.href =
            "pix-rifa.html";


    }catch(error){

        console.error(
            "Erro ao reservar:",
            error
        );

        alert(
            "❌ Erro ao reservar o número:\n\n" +
            error.message
        );


        botaoConfirmar.disabled =
            false;

        botaoConfirmar.innerHTML =
            "✅ Confirmar número";

    }

}


// ==================================================
// INICIAR
// ==================================================

carregarConfiguracaoRifa();

carregarRifa();

</script>

</body>

</html>
