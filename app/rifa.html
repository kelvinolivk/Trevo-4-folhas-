<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Rifa Trevo4Folhas 🍀</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#071307;
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
    padding:15px;
}

h1{
    margin-top:20px;
    font-size:32px;
    color:#6dff7d;
    text-shadow:0 0 15px #00ff55;
}

p{
    margin:15px;
    font-size:18px;
}

#configuracao{
    max-width:430px;
    margin:15px auto 20px;
    background:#111f14;
    border:1px solid #00ff66;
    border-radius:15px;
    padding:18px;
    line-height:1.5;
}

#contador{
    margin:15px;
    font-size:21px;
    font-weight:bold;
}

#numeros{
    max-width:430px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    padding:10px;
}

.numero{
    height:60px;
    background:#114d20;
    border:2px solid #00ff66;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 0 10px #0f0;
}

.numero:hover{
    transform:scale(1.06);
}

.escolhido{
    background:#ffd700;
    color:black;
    box-shadow:0 0 20px gold;
}

.vendido{
    background:#c40000;
    border:2px solid #ff5555;
    color:white;
    cursor:not-allowed;
    box-shadow:0 0 15px red;
}

button{
    margin-top:20px;
    width:90%;
    max-width:400px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#0b8f3a;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

</style>

</head>

<body>

<h1>🎟️ Rifa Trevo4Folhas 🍀</h1>

<p>
Escolha um número de 1 a 100
</p>

<div id="configuracao">
⏳ Carregando informações da Rifa...
</div>

<h2 id="contador">
⏳ Carregando números...
</h2>

<div id="numeros"></div>

<button
id="botaoConfirmar"
onclick="confirmarRifa()"
disabled>

✅ Confirmar número

</button>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

let numeroEscolhido = null;

const area =
document.getElementById("numeros");

const botaoConfirmar =
document.getElementById("botaoConfirmar");


/* =========================================
   CONFIGURAÇÃO
========================================= */

async function carregarConfiguracaoRifa(){

    const caixa =
        document.getElementById(
            "configuracao"
        );


    try{

        const { data,error } =

            await supabaseClient

            .from("configuracao")

            .select(
                "valor_rifa,premio_rifa,pix_rifa"
            )

            .order(
                "id",
                {ascending:false}
            )

            .limit(1);


        if(error){

            throw error;

        }


        if(!data || data.length === 0){

            caixa.innerHTML =
                "🎟️ <b>Rifa Trevo4Folhas</b><br><br>" +
                "💰 Valor: A definir<br><br>" +
                "🏆 Prêmio: A definir<br><br>" +
                "💳 Pix: A definir";

            return;

        }


        const config =
            data[0];


        const valor =
            config.valor_rifa || "A definir";


        const premio =
            config.premio_rifa || "A definir";


        const pix =
            config.pix_rifa || "A definir";


        localStorage.setItem(
            "configuracaoRifa",
            JSON.stringify({

                valor:valor,

                premio:premio,

                pix:pix

            })
        );


        caixa.innerHTML =

            "🎟️ <b>Rifa Trevo4Folhas</b>" +

            "<br><br>" +

            "💰 <b>Valor:</b> R$ " +
            valor +

            "<br><br>" +

            "🏆 <b>Prêmio:</b> " +
            premio +

            "<br><br>" +

            "💳 <b>Pix:</b><br>" +
            pix;


    }catch(error){

        console.error(error);

        caixa.innerHTML =

            "❌ Erro ao carregar a configuração." +

            "<br><br>" +

            error.message;

    }

}


/* =========================================
   CARREGAR NÚMEROS
========================================= */

async function carregarRifa(){

    const contador =
        document.getElementById(
            "contador"
        );


    try{

        const { data,error } =

            await supabaseClient

            .from("rifa_participantes")

            .select(
                "id,nome,whatsapp,numero,pagamento"
            );


        if(error){

            throw error;

        }


        const participantes =
            data || [];


        localStorage.setItem(
            "rifaParticipantes",
            JSON.stringify(
                participantes
            )
        );


        criarNumeros(
            participantes
        );


    }catch(error){

        console.error(error);

        contador.innerHTML =
            "❌ Erro ao carregar números";

        criarNumeros([]);

    }

}


/* =========================================
   CRIAR 100 NÚMEROS
========================================= */

function criarNumeros(
    participantes
){

    area.innerHTML = "";

    numeroEscolhido = null;

    botaoConfirmar.disabled = true;


    document.getElementById(
        "contador"
    ).innerHTML =
        "Número escolhido: Nenhum";


    for(
        let i=1;
        i<=100;
        i++
    ){

        const botao =
            document.createElement(
                "div"
            );


        botao.className =
            "numero";


        botao.textContent =
            String(i).padStart(2,"0");


        const reservado =
            participantes.some(
                function(p){

                    return Number(
                        p.numero
                    ) === i;

                }
            );


        if(reservado){

            botao.classList.add(
                "vendido"
            );

        }else{

            botao.onclick =
                function(){

                    document
                    .querySelectorAll(
                        ".numero"
                    )
                    .forEach(
                        function(n){

                            n.classList.remove(
                                "escolhido"
                            );

                        }
                    );


                    numeroEscolhido =
                        i;


                    botao.classList.add(
                        "escolhido"
                    );


                    document.getElementById(
                        "contador"
                    ).innerHTML =

                        "Número escolhido: " +
                        String(i).padStart(2,"0");


                    botaoConfirmar.disabled =
                        false;

                };

        }


        area.appendChild(
            botao
        );

    }

}


/* =========================================
   CONFIRMAR
========================================= */

async function confirmarRifa(){

    if(numeroEscolhido === null){

        alert(
            "Escolha um número da Rifa 🍀"
        );

        return;

    }


    const cadastro =
        JSON.parse(
            localStorage.getItem(
                "cadastro"
            )
        );


    if(
        !cadastro ||
        !cadastro.nome ||
        !cadastro.whatsapp
    ){

        alert(
            "Faça o cadastro antes de participar."
        );

        location.href =
            "cadastro.html";

        return;

    }


    botaoConfirmar.disabled =
        true;

    botaoConfirmar.innerHTML =
        "⏳ Salvando...";


    try{

        const { data:existente,error } =

            await supabaseClient

            .from("rifa_participantes")

            .select("id,numero")

            .eq(
                "numero",
                numeroEscolhido
            );


        if(error){

            throw error;

        }


        if(
            existente &&
            existente.length > 0
        ){

            alert(
                "⚠️ Esse número acabou de ser reservado."
            );

            await carregarRifa();

            botaoConfirmar.innerHTML =
                "✅ Confirmar número";

            return;

        }


        const participante = {

            nome:
                cadastro.nome,

            whatsapp:
                cadastro.whatsapp,

            numero:
                numeroEscolhido,

            pagamento:
                "🟡 Aguardando pagamento"

        };


        const { error:erroInsert } =

            await supabaseClient

            .from("rifa_participantes")

            .insert([
                participante
            ]);


        if(erroInsert){

            throw erroInsert;

        }


        localStorage.setItem(
            "rifaAtual",
            JSON.stringify({

                nome:
                    cadastro.nome,

                whatsapp:
                    cadastro.whatsapp,

                numero:
                    numeroEscolhido

            })
        );


        alert(
            "🍀 Número " +
            numeroEscolhido +
            " reservado com sucesso!"
        );


        location.href =
            "pix-rifa.html";


    }catch(error){

        console.error(error);

        alert(
            "❌ Não foi possível reservar o número:\n\n" +
            error.message
        );


        botaoConfirmar.disabled =
            false;

        botaoConfirmar.innerHTML =
            "✅ Confirmar número";

    }

}


/* =========================================
   INICIAR
========================================= */

carregarConfiguracaoRifa();

carregarRifa();

</script>

</body>
</html>
