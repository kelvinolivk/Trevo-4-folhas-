<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resultado - Trevo4Folhas 🍀</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

.caixa{
    background:#222;
    padding:20px;
    border-radius:10px;
    margin:20px auto;
    max-width:400px;
}

.numero{
    display:inline-block;
    background:#0b8f3a;
    padding:15px;
    margin:5px;
    border-radius:50%;
    font-size:25px;
    font-weight:bold;
}

</style>

</head>


<body>


<h1>🍀 Resultado Trevo4Folhas</h1>


<div id="resultado" class="caixa">

Aguardando resultado...

</div>



<script>


let resultado =

JSON.parse(localStorage.getItem("resultadoSorteio")) || null;



let tela = document.getElementById("resultado");



if(!resultado){


tela.innerHTML =

"🍀 Nenhum sorteio realizado ainda.";


}else{


let html = "";



html += "📅 Data do sorteio:<br>";

html += resultado.data;


html += "<br><br>";



html += "💰 Prêmio:<br>";

html += resultado.premio;


html += "<br><br>";



html += "🎲 Números sorteados:<br><br>";



resultado.numeros.forEach(function(n){


html +=

"<span class='numero'>"+n+"</span>";


});



html += "<br><br>";



if(resultado.vencedores[0] === "🍀 Acumulou"){


html +=

"🍀 <b>Acumulou!</b><br><br>Nenhum ganhador neste sorteio.";


}else{


html +=

"🏆 <b>Vencedor(es):</b><br><br>";



resultado.vencedores.forEach(function(v){


html += "👤 " + v + "<br>";


});


}



tela.innerHTML = html;


}



</script>


</body>

</html>
