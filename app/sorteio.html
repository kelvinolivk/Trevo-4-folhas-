<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resultados - Trevo4Folhas 🍀</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

.caixa{
    background:#222;
    padding:20px;
    border-radius:15px;
    margin:20px auto;
    max-width:400px;
    box-shadow:0 0 15px #000;
}

h1{
    color:#0b8f3a;
}

h2{
    color:#6dff7d;
}

.numero{
    display:inline-block;
    background:#0b8f3a;
    padding:15px;
    margin:5px;
    border-radius:50%;
    font-size:25px;
    font-weight:bold;
}

.numero-rifa{
    display:inline-block;
    background:#ffd700;
    color:#111;
    padding:18px;
    margin:5px;
    border-radius:12px;
    font-size:28px;
    font-weight:bold;
}

.linha{
    margin:10px 0;
}

</style>

</head>

<body>

<h1>🍀 Resultados dos Sorteios</h1>


<!-- =====================================
     LOTERIA
===================================== -->

<div class="caixa">

<h2>🍀 Loteria Trevo4Folhas</h2>

<div id="resultadoLoteria">

Aguardando resultado...

</div>

</div>


<!-- =====================================
     RIFA
===================================== -->

<div class="caixa">

<h2>🎟️ Rifa Trevo4Folhas</h2>

<div id="resultadoRifa">

Aguardando resultado da Rifa...

</div>

</div>


<script>


// =====================================
// RESULTADO DA LOTERIA
// =====================================

let resultadoLoteria = null;

try{

    resultadoLoteria =
        JSON.parse(
            localStorage.getItem("resultadoSorteio")
        );

}catch(error){

    console.error(
        "Erro ao ler resultado da loteria:",
        error
    );

    resultadoLoteria = null;

}


let telaLoteria =
    document.getElementById("resultadoLoteria");


if(!resultadoLoteria){

    telaLoteria.innerHTML =
        "🍀 Nenhum sorteio da loteria realizado ainda.";

}else{

    let numeros =
        Array.isArray(resultadoLoteria.numeros)
        ? resultadoLoteria.numeros
        : [];

    let vencedores =
        Array.isArray(resultadoLoteria.vencedores)
        ? resultadoLoteria.vencedores
        : [];


    let html = "";


    html +=
        "📅 <b>Data do sorteio:</b><br>" +
        (resultadoLoteria.data || "Não informado");


    html += "<br><br>";


    html +=
        "💰 <b>Prêmio:</b><br>" +
        (resultadoLoteria.premio || "Não informado");


    html += "<br><br>";


    html +=
        "🎲 <b>Números sorteados:</b><br><br>";


    if(numeros.length === 0){

        html +=
            "Nenhum número encontrado.";

    }else{

        numeros.forEach(function(n){

            html +=
                "<span class='numero'>" +
                String(n).padStart(2,"0") +
                "</span>";

        });

    }


    html += "<br><br>";


    if(
        vencedores.length > 0 &&
        vencedores[0] === "🍀 Acumulou"
    ){

        html +=
            "🍀 <b>Acumulou!</b><br><br>" +
            "Nenhum ganhador neste sorteio.";

    }else if(vencedores.length > 0){

        html +=
            "🏆 <b>Vencedor(es):</b><br><br>";


        vencedores.forEach(function(v){

            html +=
                "👤 " +
                v +
                "<br>";

        });

    }else{

        html +=
            "🍀 Nenhum vencedor registrado.";

    }


    telaLoteria.innerHTML = html;

}



// =====================================
// RESULTADO DA RIFA
// =====================================

let resultadoRifa = null;

try{

    resultadoRifa =
        JSON.parse(
            localStorage.getItem("resultadoRifa")
        );

}catch(error){

    console.error(
        "Erro ao ler resultado da Rifa:",
        error
    );

    resultadoRifa = null;

}


let telaRifa =
    document.getElementById("resultadoRifa");


if(!resultadoRifa){

    telaRifa.innerHTML =
        "🎟️ Nenhum sorteio da Rifa realizado ainda.";

}else{

    let html = "";


    html +=
        "📅 <b>Data do sorteio:</b><br>" +
        (resultadoRifa.data || "Não informado");


    html += "<br><br>";


    html +=
        "🎟️ <b>Número sorteado:</b><br><br>";


    html +=
        "<span class='numero-rifa'>" +
        String(
            resultadoRifa.numero
        ).padStart(2,"0") +
        "</span>";


    html += "<br><br>";


    html +=
        "🏆 <b>Ganhador:</b><br><br>" +
        "👤 " +
        (resultadoRifa.nome || "Não informado");


    if(resultadoRifa.whatsapp){

        html +=
            "<br><br>📱 " +
            resultadoRifa.whatsapp;

    }


    telaRifa.innerHTML = html;

}

</script>

</body>

</html>
