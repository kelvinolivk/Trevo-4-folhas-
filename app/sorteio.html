<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resultado - Trevo4Folhas 🍀</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

.caixa{
    margin-top:20px;
    background:#222;
    padding:20px;
    border-radius:10px;
    max-width:400px;
    margin-left:auto;
    margin-right:auto;
}

.numero{
    display:inline-block;
    background:#0b8f3a;
    padding:15px;
    margin:5px;
    border-radius:50%;
    font-size:25px;
    font-weight:bold;
}

</style>

</head>


<body>


<h1>🍀 Resultado Trevo4Folhas</h1>


<div id="resultado" class="caixa">

Carregando resultado...

</div>



<script>


let numeros =

JSON.parse(localStorage.getItem("resultadoSorteio")) || null;



let participantes =

JSON.parse(localStorage.getItem("participantes")) || [];



let resultado = document.getElementById("resultado");



if(!numeros){


resultado.innerHTML =

"🍀 Ainda não existe sorteio realizado.";


}else{


let vencedores=[];



participantes.forEach(function(p){



if(p.pagamento === "🟢 Pagamento confirmado"){



let aposta=p.numero;



if(typeof aposta === "string"){

aposta=JSON.parse(aposta);

}



let ganhou = aposta.every(function(n){

return numeros.includes(n);

});



if(ganhou){

vencedores.push(p.nome);

}


}


});



let html =

"🎲 Números sorteados:<br><br>";



numeros.forEach(function(n){


html +=

"<div class='numero'>"+n+"</div>";


});



if(vencedores.length > 0){


html +=

"<br><br>🏆 <b>Vencedor(es):</b><br><br>";



vencedores.forEach(function(v){


html += "👤 "+v+"<br>";

});


}else{


html +=

"<br><br>🍀 <b>Acumulou!</b><br>Nenhum ganhador desta vez.";


}



resultado.innerHTML = html;


}



</script>


</body>
</html>
