<!DOCTYPE html>
<html>
<head>
<title>Trevo4Folhas 🍀</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b8f3a">
<style>

body {
    font-family: Arial;
    background:#111;
    color:white;
    text-align:center;
    padding:30px;
    overflow-x:hidden;
}


/* Trevos no fundo */

body::before{
    content:"🍀  🍀  🍀  🍀  🍀  🍀  🍀  🍀";
    position:fixed;
    top:10px;
    left:0;
    width:100%;
    font-size:50px;
    opacity:0.08;
    z-index:-1;
    line-height:100px;
}


h1 {
    font-size:45px;
    margin-bottom:5px;
    color:#0b8f3a;
    text-shadow:0 0 10px black;
}


.subtitulo{
    font-size:18px;
    color:#ddd;
}


.caixa{
    background:#222;
    padding:20px;
    border-radius:15px;
    margin:20px auto;
    max-width:400px;
    box-shadow:0 0 15px #000;
    border:1px solid #333;
}


#contador{
    font-size:22px;
    font-weight:bold;
}


button {
    width:90%;
    padding:16px;
    margin:10px;
    border-radius:12px;
    border:none;
    background:#0b8f3a;
    color:white;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 5px 10px #000;
}


button:active{
    transform:scale(0.97);
}


.logo{
    font-size:70px;
}


</style>

</head>


<body>


<div class="logo">
🍀
</div>


<h1>Trevo4Folhas</h1>

<p class="subtitulo">
Loteria privada do grupo
</p>



<div class="caixa" id="informacoes">
Carregando informações...
</div>


<div class="caixa" id="contador">
Calculando tempo...
</div>



<button onclick="location.href='app/cadastro.html'">
👤 Cadastro
</button>


<button onclick="location.href='app/numeros.html'">
🎟️ Escolher número
</button>

<button onclick="location.href='app/rifa.html'">
🔥 TESTE RIFA
</button>
<button onclick="location.href='app/minhas-apostas.html'">
📋 Minhas Apostas
</button>


<button onclick="location.href='app/pix.html'">
💰 Pagamento Pix
</button>


<button onclick="location.href='app/sorteio.html'">
🎲 Sorteio
</button>


<button onclick="location.href='app/historico.html'">
📚 Histórico de Sorteios
</button>

<button onclick="location.href='app/rifa.html'">
🎟️ Rifa 1 a 100
</button>
<button onclick="location.href='app/admin.html'">
🔐 Área do Administrador
</button>




<script>


let configuracao =
JSON.parse(localStorage.getItem("configuracao")) || {};



document.getElementById("informacoes").innerHTML = `


🏆 <b>Prêmio atual:</b><br>

${configuracao.premio || "A definir"}

<br><br>


📅 <b>Próximo sorteio:</b><br>

${configuracao.data || "A definir"}

<br><br>


⏰ <b>Horário:</b><br>

${configuracao.hora || "A definir"}

<br><br>


🍀 ${configuracao.mensagem || "Boa sorte!"}


`;



function atualizarContador(){


if(!configuracao.data || !configuracao.hora){

document.getElementById("contador").innerHTML =
"⏳ Data do sorteio ainda não definida";

return;

}


let partesData = configuracao.data.split("/");


let hora = configuracao.hora.split(":");



let dataSorteio = new Date(

partesData[2],

partesData[1] - 1,

partesData[0],

hora[0],

hora[1]

);



let agora = new Date();


let diferenca = dataSorteio - agora;



if(diferenca <= 0){

document.getElementById("contador").innerHTML =
"🎲 Sorteio realizado!";

return;

}



let dias = Math.floor(
diferenca / (1000 * 60 * 60 * 24)
);


let horas = Math.floor(
(diferenca % (1000 * 60 * 60 * 24))
/ (1000 * 60 * 60)
);


let minutos = Math.floor(
(diferenca % (1000 * 60 * 60))
/ (1000 * 60)
);


let segundos = Math.floor(
(diferenca % (1000 * 60))
/ 1000
);



document.getElementById("contador").innerHTML =

"⏳ Faltam:<br><br>" +

dias + " dias | " +

horas + " horas | " +

minutos + " min | " +

segundos + " seg";


}



setInterval(atualizarContador,1000);

atualizarContador();


</script>

<script>
if ("serviceWorker" in navigator) {

window.addEventListener("load", function(){

navigator.serviceWorker.register("service-worker.js");

});

}
</script>
</body>
</html>
